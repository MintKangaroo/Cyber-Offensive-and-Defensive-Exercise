# 단일 시나리오: 스마트팩토리 — 생산라인 사보타주
# ================================================
# MES 작업지시 SQLi → PLC 프로그램 다운로드 → 로봇 컨트롤러 명령 주입(최종).
scenario:
  id: "FACTORY-SABOTAGE-01"
  name: "스마트팩토리 생산라인 사보타주 작전"
  description: "MES 침투와 PLC 로직 조작을 거쳐 로봇 컨트롤러를 장악하는 킬체인"
  target_asset: "smart_factory"
  difficulty: "hard"
  time_limit_sec: 1800

  initial_vuln_state:
    FAC-001: vulnerable
    FAC-002: vulnerable
    FAC-003: vulnerable

  stages:
    - stage: 1
      name: "정보 수집 - MES 작업지시 SQL 인젝션"
      objective_event: flag_exfiltrated
      match: { vuln_id: "FAC-003" }
      points: 25
      mitre: [T1190]
    - stage: 2
      name: "제어 장악 - PLC 프로그램 다운로드"
      objective_event: red_attack_started
      match: { vuln_id: "FAC-001" }
      points: 35
      requires_stage: 1
      mitre: [T0843]
    - stage: 3
      name: "목표 달성 - 로봇 컨트롤러 명령 주입"
      objective_event: red_attack_started
      match: { vuln_id: "FAC-002" }
      points: 55
      requires_stage: 2
      mitre: [T0807]
      is_final: true

  chain_bonus:
    all_stages_in_order: 50
    within_sec: 600

  blue_objectives:
    - name: "로봇 명령 주입 탐지"
      match_alert: "ICS-FAC-ROBOT-CMDI-001"
      points: 40
    - name: "MES SQLi 탐지"
      match_alert: "ICS-FAC-MES-SQLI-001"
      points: 30

  noise:
    enabled: true
    normal_traffic_eps: 5
