# 단일 시나리오: 정유/석유화학 플랜트 SIS 사보타주
# =====================================================
# OPC UA 정찰 → HART 탱크게이지 위조 → SIS 안전계장 우회(최종 임팩트).
# challenge_schema.Scenario 준수. 신규 ICS 섹터 트윈(refinery_plant) 대상.

scenario:
  id: "REFINERY-SABOTAGE-01"
  name: "정유 플랜트 안전계장 사보타주 작전"
  description: "OPC UA 정찰부터 SIS(안전계장) 트립 우회까지의 OT 킬체인"
  target_asset: "refinery_plant"
  difficulty: "hard"
  time_limit_sec: 1800

  initial_vuln_state:
    REF-001: vulnerable
    REF-002: vulnerable
    REF-003: vulnerable

  stages:
    - stage: 1
      name: "정찰 - OPC UA 미인증 태그 열람"
      objective_event: red_attack_started
      match: { vuln_id: "REF-001" }
      points: 25
      mitre: [T0886]
    - stage: 2
      name: "공정 조작 - HART 탱크 게이지 위조"
      objective_event: red_attack_started
      match: { vuln_id: "REF-003" }
      points: 35
      requires_stage: 1
      mitre: [T0836]
    - stage: 3
      name: "목표 달성 - SIS 안전계장 트립 우회"
      objective_event: red_objective_success
      match: { vuln_id: "REF-002" }
      points: 60
      requires_stage: 2
      mitre: [T0858, T0800]
      is_final: true

  chain_bonus:
    all_stages_in_order: 50
    within_sec: 600

  blue_objectives:
    - name: "SIS 우회 탐지"
      match_alert: "ICS-REF-SIS-BYPASS-001"
      points: 40
    - name: "SIS 취약점 패치"
      match_event: blue_patch_verified
      match: { vuln_id: "REF-002" }
      points: 50
      time_bonus: true

  noise:
    enabled: true
    normal_traffic_eps: 5
