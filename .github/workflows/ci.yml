name: CI

# 회귀 안전망(P1-2): 순수 로직 유닛 테스트(빠름) + docker 통합 스모크(강력).
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1) 유닛 테스트 — docker 불필요, 수 초 내 완료. 모든 푸시/PR에서 실행.
  #    metrics/heatmap(AAR), _event_epoch(SIEM), EDR 규칙 등 버그 회귀 방지.
  # ---------------------------------------------------------------------------
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Run unit + contract tests
        run: python -m pytest tests/ -v

  # ---------------------------------------------------------------------------
  # 1b) clean install 검증(감사 1.1) — 런타임 requirements.txt 만으로 핵심 임포트가
  #     되는지. python-dotenv 누락으로 clean 호스트 기동이 깨지던 회귀(S-6)를 막는다.
  # ---------------------------------------------------------------------------
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime requirements only
        run: pip install -r requirements.txt
      - name: Import dotenv (must be present)
        run: python -c "import dotenv; print('python-dotenv', dotenv.__version__)"

  # ---------------------------------------------------------------------------
  # 2) 챌린지 QA(docker 불필요) — 전체 챌린지 schema + 아티팩트/탐지 게이트 실채점.
  #    아티팩트형은 생성→solve→grade, 탐지형은 진짜 SIEM 엔진 채점까지 CI에서 검증.
  #    서비스형(docker 배포)은 스키마만(실배포는 로컬/전용 잡).
  # ---------------------------------------------------------------------------
  challenges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Validate all challenges (schema + artifact/detection gates)
        run: bash scripts/validate_challenges.sh

  # ---------------------------------------------------------------------------
  # 3) 프론트엔드 — LiveFire 대시보드 유닛테스트(vitest) + 프로덕션 빌드.
  #    ProcessImpact 순수 로직(심각도 매핑/계기값 보간/게이지) 회귀 방지.
  # ---------------------------------------------------------------------------
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboards/livefire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------------------
  # 4) 통합 스모크 — 실제 docker 스택을 띄우고 E2E 경로를 검증(격리·복구 포함).
  #    override 파일이 없어 edr는 8080에 뜨며, smoke_test.sh가 포트를 자동 감지한다.
  # ---------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # dev 스모크: 토큰 없이 컨트롤플레인을 쓰므로 명시적으로 dev 우회를 켠다(fail-closed 기본).
    # CHALLENGE_SECRET 는 challenge_portal 가 fail-fast 로 요구하므로 CI 용 더미를 주입.
    env:
      CHALLENGE_SECRET: ci-challenge-secret-not-for-prod
      RBAC_ALLOW_INSECURE_DEV: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Build & start stack
        run: |
          docker compose up -d --build \
            event_collector scoring_engine config_service edr_backend siem_api \
            scenario_engine instructor_api aar_report noc_monitor range_control \
            auth challenge_portal incident injects observability \
            ground_station power_plant water_utility defense_network \
            gs_gateway pp_gateway dn_gateway

      - name: Assert challenge_portal image ships no exploit/solution (감사 1.7)
        run: |
          leaked=$(docker exec challenge_portal sh -c \
            'find / \( -name exploit.py -o -name writeup.md \) 2>/dev/null | head' || true)
          if [ -n "$leaked" ]; then
            echo "FATAL: 이미지에 풀이/익스플로잇 잔존:"; echo "$leaked"; exit 1
          fi
          echo "challenge_portal image clean (no exploit.py/writeup.md)"

      - name: Wait for core health
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8010/health >/dev/null 2>&1 \
               && curl -sf http://localhost:8090/health >/dev/null 2>&1; then
              echo "core services healthy"; exit 0
            fi
            sleep 3
          done
          echo "services did not become healthy in time"; exit 1

      - name: New services health (auth·incident·injects·observability·portal·range)
        run: |
          fail=0
          for pair in auth:8051 range_control:8055 challenge_portal:8060 \
                      incident:8095 injects:8096 observability:8097; do
            port=${pair#*:}; name=${pair%:*}
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:$port/health)
            echo "$name ($port): $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail

      - name: SSE + observability + ICS Modbus E2E
        run: |
          # SSE 스트림 존재
          curl -sf "http://localhost:8010/stream?topics=events" --max-time 2 >/dev/null && echo "SSE ok" || true
          # 관측성 요약(전 서비스 스크레이프)
          curl -sf http://localhost:8097/observability/summary | python3 -c "import sys,json;d=json.load(sys.stdin);print('platform up',d['up'],'/',d['total']);exit(0 if d['up']>=6 else 1)"
          # 컨테이너 내 실제 Modbus(pp_twin:502) — 트윈이 진짜 Modbus 를 말하는지
          docker cp infra/ci/modbus_probe.py event_collector:/tmp/mb.py
          docker exec event_collector python3 /tmp/mb.py

      - name: Integration smoke test (with recovery)
        run: SMOKE_RECOVERY=1 SMOKE_CRASH_RECOVERY=1 bash scripts/smoke_test.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=80

      - name: Teardown
        if: always()
        run: docker compose down -v
