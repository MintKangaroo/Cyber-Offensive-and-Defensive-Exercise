name: Load Test (nightly)

# 감사 4.10: 부하 하네스(k6 3종)를 nightly로 실행해 회귀·수용 인원 기준선을 추적한다.
on:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST (UTC 18:00)
  workflow_dispatch:

permissions:
  contents: write   # 결과를 loadtest/results/ 에 커밋

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # ingest·twin 부하는 토큰 없이 흘리므로 dev 우회 + CHALLENGE_SECRET 더미.
    # A/D 부하는 실 JWT 를 요구한다 → AUTH_JWT_SECRET 로 매치/팀/경쟁자 토큰을 부트스트랩한다.
    # (이 시크릿은 auth·attack_defense 컨테이너에만 도달; event_collector ingest 경로는
    #  SERVICE_TOKEN 기반이라 영향 없음 — dev 우회 유지.)
    env:
      RBAC_ALLOW_INSECURE_DEV: "true"
      CHALLENGE_SECRET: ci-loadtest-secret
      AUTH_JWT_SECRET: ci-loadtest-jwt-secret
      # 부하 프로파일은 rate limiter 가 아니라 제출/채점 경로 처리량을 측정한다 →
      # 팀당 분당 제출 상한을 대폭 올려 429 로 막히지 않게 한다(429 는 k6 에서 기대 상태).
      MAX_FLAG_SUBMISSIONS_PER_MINUTE: "100000"
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Start stack (ingest·scoring·twins·A/D)
        run: |
          docker compose up -d --build \
            event_collector scoring_engine config_service ingest_proxy \
            ground_station power_plant defense_network gs_gateway pp_gateway dn_gateway \
            auth attack_defense ad_registry ad_team_01_notes ad_team_01_vault

      - name: Wait for core health
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8010/health >/dev/null 2>&1 \
              && curl -sf http://localhost:8020/health >/dev/null 2>&1 \
              && curl -sf http://localhost:8100/health >/dev/null 2>&1 \
              && exit 0
            sleep 3
          done
          echo "stack not healthy"; exit 1

      - name: Bootstrap A/D match·teams·tokens
        run: |
          mkdir -p loadtest/results
          AD_API=http://localhost:8100 MATCH_ID=ad-load AD_TEAMS=12 \
            python3 loadtest/k6/bootstrap_ad.py

      - name: Run k6 (3종, summary export)
        id: k6
        run: |
          mkdir -p loadtest/results
          STAMP=$(date -u +%Y%m%d)
          fail=0
          # ingest·twin 은 게이팅: 임계 위반 시 회귀로 보고 잡의 실패로 승격(아래 Enforce 스텝).
          for s in event_collector_ingest twin_attack_load; do
            if ! k6 run --summary-export "loadtest/results/${s}.${STAMP}.json" "loadtest/k6/${s}.js"; then
              echo "::warning::k6 $s 임계 위반(회귀 후보)"; fail=1
            fi
          done
          # attack_defense 는 이제 부트스트랩(매치·팀·competitor 토큰)이 선행되므로 게이팅한다.
          # 토큰은 파일에서만 읽어 로그 노출을 피한다(k6 env 로만 전달).
          COMPETITOR_TOKENS="$(cat loadtest/results/ad_competitor_tokens.txt)" \
          MATCH_ID=ad-load DURATION=90s SCOREBOARD_VUS=12 SUBMISSIONS_PER_SECOND=10 \
            k6 run --summary-export "loadtest/results/attack_defense.${STAMP}.json" loadtest/k6/attack_defense.js \
            || { echo "::warning::k6 attack_defense 임계 위반(회귀 후보)"; fail=1; }
          # 최신 결과를 latest 심볼릭 파일로도 저장(기준선 비교 편의)
          for s in event_collector_ingest twin_attack_load attack_defense; do
            cp "loadtest/results/${s}.${STAMP}.json" "loadtest/results/${s}.latest.json" 2>/dev/null || true
          done
          echo "gate_fail=$fail" >> "$GITHUB_OUTPUT"

      - name: Upload results (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-results
          path: loadtest/results/*.json

      - name: Commit results to loadtest/results/
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add loadtest/results/*.json || true
          git commit -m "chore(loadtest): nightly k6 결과 갱신 [skip ci]" || echo "no changes"
          git push || echo "push skipped"

      # 게이트에 이빨 달기: 결과 커밋 후, ingest/twin 임계 위반이면 잡을 실패시킨다.
      # (이전엔 `|| echo` 로 k6 종료코드를 삼켜 임계 실패가 green 으로 가려졌다.)
      - name: Enforce load thresholds (gate)
        if: always()
        run: |
          if [ "${{ steps.k6.outputs.gate_fail }}" = "1" ]; then
            echo "부하 회귀 임계 위반 — 게이트 실패 (ingest·twin·attack_defense)"; exit 1
          fi
          echo "부하 게이트 통과 (ingest·twin·attack_defense)"

      - name: Teardown
        if: always()
        run: docker compose down -v
