# CCE형 국가기반시설 본선 세트 (2026) — 난이도·카테고리 균형 큐레이션.
# 포털이 competitions/*.yaml 을 로드해 세트 단위 목록·스코어보드를 제공한다.
# 점수는 각 challenge.yaml 의 points.red 를 그대로 사용(세트는 '선택'만 한다).
competition:
  id: "cce-infra-final-2026"
  name: "CCE형 국가기반시설 본선 2026"
  description: |
    국가기반시설(에너지·수자원·교통·의료·재난) 테마로 카테고리·난이도를 균형 있게 큐레이션한
    본선 세트. 웹·포너블·크립토·리버싱·포렌식·네트워크·ICS·AI·탐지 9개 분야, easy→insane 곡선.
  duration_hours: 8
  challenges:
    # web (6)
    - WEB-011   # 석유공사 권한상승 (easy)
    - WEB-022   # 에너지신고 CSV 수식 인젝션 (easy)
    - WEB-013   # 철도관제 SSRF (medium)
    - WEB-018   # 병원 EMR NoSQLi (medium)
    - WEB-017   # 공항 SSTI (hard)
    - WEB-009   # WAF 우회 + 블라인드 SQLi (insane)
    # pwn (3)
    - PWN-002   # 가스공사 밸브 전역 BOF (easy)
    - PWN-001   # 정수처리장 포맷스트링 (medium)
    - PWN-000   # LNG경보센터 ret2win (medium)
    # crypto (1)
    - CRY-000   # 재난망 AES-ECB 오라클 (hard)
    # reversing (3)
    - REV-000   # XOR decode (easy)
    - REV-001   # 난독화 라이선스 (medium)
    - REV-004   # 스택 VM 리버싱 (hard)
    # forensics (3)
    - FOR-000   # 평문 자격증명 카빙 (easy)
    - FOR-002   # 침해 재구성 (medium)
    - FOR-007   # 프로세스 할로잉 (hard)
    # network (3)
    - NET-000   # 평문 프로토콜 스니핑 (easy)
    - NET-002   # Lateral Pivot (medium)
    - NET-009   # OT 사보타주 트레이스 (insane)
    # ics (3)
    - ICS-001   # (easy)
    - ICS-000   # Modbus (medium)
    - ICS-009   # (hard)
    # ai (2)
    - AI-000    # (easy)
    - AI-007    # (hard)
  # 참고: 방어(blue) 트랙은 detection 카테고리(DET-*)로 별도 구성되며 SIEM 엔진이 채점한다
  # (포털의 red 플래그 스코어보드와 채점 계통이 달라 이 세트에는 포함하지 않는다).
