services:
  pwn014_deploy:
    build: { context: . }
    container_name: pwn014_deploy
    ports: ["9024:9024"]
    environment:
      - CHALLENGE_SECRET=${CHALLENGE_SECRET:-pwn014-dev-secret}
      - PORT=9024
    mem_limit: 128m
    pids_limit: 64
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
