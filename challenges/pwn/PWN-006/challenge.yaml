challenge:
  id: "PWN-006"
  title: "원자로 냉각계통 제어 콘솔 - tcache poisoning 임의할당 → 전역 함수포인터 하이재킹"
  category: "pwn"
  difficulty: "hard"
  points: { red: 260, blue: 260 }
  asset: "reactor"
  mitre: [T1203, T1068]

  description: |
    원자로 냉각계통 제어 콘솔(원격 TCP)이 냉각채널 버퍼를 free 해도 슬롯 포인터를 비우지 않아
    free-후-수정(UAF write)이 가능하다. 서로 다른 두 채널을 free 하면 tcache bin 에 2개가 쌓이는데
    (count=2), bin head 청크의 next 포인터(glibc safe-linking)를 전역 g_ctl 주소로 위조하면
    이어지는 두 번째 malloc 이 g_ctl 자리에 청크를 돌려준다(tcache poisoning = 임의 주소 할당).
    그 자리에 진단 함수포인터를 admin_shell 로 덮고 진단을 실행하면 /flag 가 노출된다.
    채널 할당 시 힙 핸들(%p)이 출력되므로 safe-linking 마스크(addr>>12)를 역산할 수 있다.
    (PWN-003 힙 오버플로우·PWN-005 UAF 단순재사용과 구분되는 tcache poisoning/임의할당 유형)

  red_task:
    goal: "두 채널 free 로 tcache count=2 확보 → UAF write 로 head next 를 g_ctl 로 위조(safe-linking) → 두 번째 malloc 이 g_ctl 반환 → diag 를 admin_shell 로 덮고 진단 실행"
    flag_format: "flag{...}"
    flag_type: "static"
    submit_fields: ["flag"]
    hints:
      - { cost: 10, text: "채널 할당 시 출력되는 %p 가 힙 핸들이다. free 후에도 갱신(edit)이 되는가?" }
      - { cost: 20, text: "tcache next 는 safe-linked: stored = (청크주소>>12) XOR 목표. head 청크(마지막 free)의 next 를 g_ctl 로 위조." }
      - { cost: 30, text: "malloc 2회: 1회는 head, 2회째가 g_ctl. 거기에 admin_shell 주소를 써 diag 를 덮고 4)진단 실행. g_ctl·admin_shell 은 no-PIE 고정." }

  blue_task:
    goal: "free 후 dangling 제거·UAF write 차단으로 tcache 메타데이터 위조 봉쇄"
    success_criteria: |
      (1) free 된 채널에 대한 갱신(UAF write)·비정상 핸들 참조 관측
      (2) 패치 후 free 슬롯 갱신이 거부되어 tcache next 위조 불가
    points_breakdown: { detection: 78, patch: 182 }

  scoring:
    red_verify: "flag_match"
    blue_verify: ["safe_probe"]

  artifacts: ["reactor"]
  safety:
    profile: "hardened"
    notes: "원격 정적 바이너리(no-PIE·의도적 UAF/tcache poisoning). cap_drop/pids_limit/mem_limit, 30초 타임아웃."
