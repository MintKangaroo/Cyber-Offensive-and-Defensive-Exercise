services:
  pwn005_deploy:
    build: { context: . }
    container_name: pwn005_deploy
    ports: ["9015:9015"]
    environment:
      - CHALLENGE_SECRET=${CHALLENGE_SECRET:-pwn005-dev-secret}
      - PORT=9015
    mem_limit: 128m
    pids_limit: 64
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
