challenge:
  id: "DET-004"
  title: "C2 비콘 주기성 탐지"
  category: "detection"
  difficulty: "hard"
  points: { red: 0, blue: 90 }
  mitre: [T1071]
  description: |
    감염 호스트가 C2로 규칙적인 간격으로 접속하는 비콘을 주기성(periodicity) 규칙으로 탐지하라.
    간격의 흔들림(jitter)이 낮으면 자동화된 비콘이다. 단, 내부 DNS/NTP처럼 정상적으로 규칙적인
    폴링 목적지는 allowlist로 제외해 오탐을 막아야 한다. 우리 SIEM 엔진이 실제 채점한다.
  blue_task:
    goal: "(src,dst) 주기성 규칙 작성 + 정상 폴링 목적지 allowlist 튜닝"
    success_criteria: |
      (1) attack_log.jsonl(등간격 비콘)에 알림 발생
      (2) normal_log.jsonl(allowlist 폴링 + 불규칙 트래픽)에는 오탐 없음
  scoring:
    blue_verify: "alert_dataset_check"
  artifacts: ["attack_log.jsonl", "normal_log.jsonl"]
  safety:
    profile: "standard"
    notes: "합성 연결 로그 데이터셋만 사용."
