services:
  cry016_deploy:
    build: { context: . }
    container_name: cry016_deploy
    ports: ["8148:8148"]
    environment:
      - CHALLENGE_SECRET=${CHALLENGE_SECRET:-cry016-dev-secret}
      - PATCH_CRY_016=false
    mem_limit: 160m
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
