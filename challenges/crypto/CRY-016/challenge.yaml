challenge:
  id: "CRY-016"
  title: "원자로 명령 게이트웨이 - RSA 저지수 stereotyped 메시지(Coppersmith)"
  category: "crypto"
  difficulty: "insane"
  points: { red: 280, blue: 280 }
  asset: "reactor-rsa-lowexp"
  mitre: [T1552]

  description: |
    원자로 명령 게이트웨이가 명령 m = int(prefix)<<k | token 을 RSA(e=3)로 암호화해 공개한다. 접두부
    prefix 와 미지 비트수 k(=96)는 공개된다. e=3 이고 미지 token 이 작으면(|x0| < N^(1/3)) 다항식
    f(x)=(a+x)^3 - c mod N (a=int(prefix)<<k)의 작은 근 x0=token 을 Coppersmith 의 작은 근 정리
    (Howgrave-Graham 격자 + LLL)로 개인키 없이 복구할 수 있다. 복구한 token 을 POST /api/recover 에
    제출하면 flag.

  red_task:
    goal: "GET /api/message 의 (N,e=3,c,prefix,k) → f(x)=(a+x)^3-c 의 작은 근을 Coppersmith 로 복구 → /api/recover"
    flag_format: "flag{...}"
    flag_type: "static"
    submit_fields: ["flag"]
    hints:
      - { cost: 10, text: "e=3 이고 메시지 대부분(prefix)이 알려져 있다. 미지 부분(token)은 하위 96비트뿐." }
      - { cost: 20, text: "f(x)=(a+x)^3 - c mod N, a=int(prefix)<<96. 미지 근 |x0|<2^96 < N^(1/3) 이면 Coppersmith 로 복구." }
      - { cost: 30, text: "Howgrave-Graham 격자(N^(m-i) x^j f^i, x^j f^m)를 LLL 축약해 정수 다항식의 작은 근을 찾아라." }

  blue_task:
    goal: "공개지수 e=65537 + OAEP 무작위 패딩으로 저지수·stereotyped 공격을 무력화"
    success_criteria: |
      (1) e 가 작고(3) 메시지 구조가 예측 가능한지 관측 — 미지부분 < N^(1/e) 이면 Coppersmith 가능
      (2) 패치 후 e=65537 로 미지부분이 N^(1/e) 를 크게 초과해 작은 근 복구 불가
    points_breakdown: { detection: 84, patch: 196 }

  scoring:
    red_verify: "flag_match"
    blue_verify: ["safe_probe"]

  artifacts: ["reactor-rsa-lowexp"]
  safety:
    profile: "hardened"
    notes: "HTTP 서비스형. read_only/tmpfs/cap_drop/mem_limit. 512비트 RSA·e=3 은 훈련용 축소 파라미터이며 실 명령키 아님."
