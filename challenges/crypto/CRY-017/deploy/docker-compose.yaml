services:
  cry017_deploy:
    build: { context: . }
    container_name: cry017_deploy
    ports: ["8149:8149"]
    environment:
      - CHALLENGE_SECRET=${CHALLENGE_SECRET:?requires CHALLENGE_SECRET}
      - PATCH_CRY_017=false
    mem_limit: 160m
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
