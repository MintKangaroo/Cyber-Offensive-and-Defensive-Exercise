challenge:
  id: "CRY-009"
  title: "재난경보 OTP 발급 - MT19937 상태복구 예측"
  category: "crypto"
  difficulty: "hard"
  points: { red: 230, blue: 230 }
  asset: "disaster-otp"
  mitre: [T1110]

  description: |
    재난경보 관제 OTP 발급기가 일회용 토큰을 파이썬 기본 PRNG(MT19937)로 생성한다. MT19937 은
    암호학적으로 안전하지 않아, 연속된 624개의 32비트 출력을 관측하면 tempering 을 역산
    (untemper)해 내부 상태 624워드를 완전히 복구할 수 있다. 상태를 복제하면 그 다음 출력을
    정확히 예측할 수 있다. 서버가 배포한 624개 토큰으로 다음 관리자 OTP 를 예측해 제출하면 flag.

  red_task:
    goal: "624개 32비트 출력 untemper → MT19937 상태 복구·복제 → 다음 OTP 예측 → /api/admin 로 flag"
    flag_format: "flag{...}"
    flag_type: "static"
    submit_fields: ["flag"]
    hints:
      - { cost: 10, text: "OTP 가 파이썬 random(MT19937)로 생성된다. 이는 CSPRNG 가 아니다 — 출력으로 상태를 복원할 수 있다." }
      - { cost: 20, text: "getrandbits(32) 출력 각각에 tempering 역함수(untemper)를 적용해 상태 워드 624개 복구." }
      - { cost: 30, text: "복구한 624 워드로 random.Random 상태를 setstate → 다음 getrandbits(32) 가 관리자 OTP. /api/admin 제출." }

  blue_task:
    goal: "OTP 를 CSPRNG(secrets/os.urandom)로 발급해 상태복구·예측 차단"
    success_criteria: |
      (1) 토큰이 MT19937(random) 기반인지, 연속 출력이 그대로 노출되는지 점검
      (2) 패치 후 OTP 가 CSPRNG 라 624개 관측으로도 다음 값 예측 불가
    points_breakdown: { detection: 69, patch: 161 }

  scoring:
    red_verify: "flag_match"
    blue_verify: ["safe_probe"]

  artifacts: ["disaster-otp"]
  safety:
    profile: "hardened"
    notes: "HTTP 서비스형. read_only/tmpfs/cap_drop/mem_limit. 취약은 의도된 비암호 PRNG 사용이며 실제 OTP 아님."
