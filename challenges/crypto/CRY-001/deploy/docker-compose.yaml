services:
  cry001_deploy:
    build: { context: . }
    container_name: cry001_deploy
    ports: ["8133:8133"]
    environment:
      - CHALLENGE_SECRET=${CHALLENGE_SECRET:?requires CHALLENGE_SECRET}
      - PATCH_CRY_001=false
    mem_limit: 160m
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
