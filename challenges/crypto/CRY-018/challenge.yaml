challenge:
  id: "CRY-018"
  title: "국가 PKI 루트키 백업 - Coppersmith 부분키 노출(p 상위비트) 인수분해"
  category: "crypto"
  difficulty: "insane"
  points: { red: 280, blue: 280 }
  asset: "pki-partial-key"
  mitre: [T1552]

  description: |
    국가 PKI 루트키 백업 시스템이 로그에 소수 p 의 상위 비트 p_high 를 남긴다(부분키 노출). N 과
    p_high, 미지 비트수(unknown_bits)가 주어질 때 p = p_high + x0 (0<=x0<2^unknown_bits) 이고 x0 이
    N^(1/4) 미만이면, f(x)=p_high+x 의 미지 divisor(p|N) 에 대한 작은 근 x0 을 Coppersmith
    (Howgrave-Graham 격자 + LLL, beta=0.5)로 복구해 N 을 인수분해할 수 있다. 복구한 소인수를
    POST /api/recover 에 제출하면 flag.

  red_task:
    goal: "GET /api/leak 의 (N,p_high,unknown_bits) → f(x)=p_high+x 의 divisor 소근을 Coppersmith 로 복구 → gcd → 인수 제출"
    flag_format: "flag{...}"
    flag_type: "static"
    submit_fields: ["flag"]
    hints:
      - { cost: 10, text: "p 의 상위 비트가 유출됐다. p = p_high + x, 미지 x 는 하위 unknown_bits 뿐." }
      - { cost: 20, text: "미지 x 가 N^(1/4) 미만이면 f(x)=p_high+x 의 divisor(p) 에 대한 작은 근을 Coppersmith(beta=0.5)로 복구." }
      - { cost: 30, text: "격자 rows: N^(m-i) f^i (i=0..m), x^j f^m (j=1..t). LLL 후 정수 다항식의 작은 근 → p=p_high+x0 → gcd(p,N)." }

  blue_task:
    goal: "키 자재의 비트 유출 제거 / 노출 규모를 N^(1/4) 미만이 되지 않게 관리"
    success_criteria: |
      (1) 소인수의 상위 비트가 로그/백업에 노출되고 미지 부분이 N^(1/4) 미만인지 관측
      (2) 패치 후 미지 비트가 N^(1/4) 를 초과해 Coppersmith 로 인수분해 불가
    points_breakdown: { detection: 84, patch: 196 }

  scoring:
    red_verify: "flag_match"
    blue_verify: ["safe_probe"]

  artifacts: ["pki-partial-key"]
  safety:
    profile: "hardened"
    notes: "HTTP 서비스형. read_only/tmpfs/cap_drop/mem_limit. 512비트 RSA 는 훈련용 축소 파라미터이며 실 루트키 아님."
