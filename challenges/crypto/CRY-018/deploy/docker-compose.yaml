services:
  cry018_deploy:
    build: { context: . }
    container_name: cry018_deploy
    ports: ["8150:8150"]
    environment:
      - CHALLENGE_SECRET=${CHALLENGE_SECRET:-cry018-dev-secret}
      - PATCH_CRY_018=false
    mem_limit: 160m
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
