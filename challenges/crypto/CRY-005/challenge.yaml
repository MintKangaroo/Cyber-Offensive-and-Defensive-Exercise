challenge:
  id: "CRY-005"
  title: "정부 전자서명 감사시스템 - DSA 논스 재사용 개인키 복구"
  category: "crypto"
  difficulty: "hard"
  points: { red: 230, blue: 230 }
  asset: "gov-esign-audit"
  mitre: [T1040]

  description: |
    정부 전자서명 감사시스템이 감사 레코드 두 건을 DSA 로 서명해 배포하는데, 두 서명이 '같은
    논스 k'를 재사용한다(r 이 동일). 같은 k 면 k=(H1-H2)·(s1-s2)^{-1} mod q 로 논스를 구하고,
    x=(s1·k-H1)·r^{-1} mod q 로 서명 개인키 x 를 복구할 수 있다. 복구한 x 로 관리자 승인 메시지
    ("ADMIN-OVERRIDE-GRANT")를 서명해 제출하면 서버가 공개키 y 로 검증하고 flag 를 내준다.

  red_task:
    goal: "동일 논스로 서명된 두 레코드로 개인키 x 복구 → 관리자 메시지 서명 위조 → /api/admin/grant 로 flag"
    flag_format: "flag{...}"
    flag_type: "static"
    submit_fields: ["flag"]
    hints:
      - { cost: 10, text: "두 감사 서명의 r 값이 같다. DSA 에서 r 이 같다는 것은 무엇을 의미하나?" }
      - { cost: 20, text: "같은 k: k=(H1-H2)/(s1-s2) mod q. H 는 SHA-1 을 q 비트로 자른 값." }
      - { cost: 30, text: "x=(s1·k-H1)/r mod q. 복구한 x 로 'ADMIN-OVERRIDE-GRANT' 를 표준 DSA 서명해 grant 로 제출." }

  blue_task:
    goal: "서명마다 암호학적 임의 논스를 써서(재사용 제거) 개인키 복구 차단"
    success_criteria: |
      (1) 서로 다른 메시지의 서명에서 r 값이 동일한지(논스 재사용) 점검
      (2) 패치 후 r 이 매번 달라 개인키 복구·서명 위조 불가
    points_breakdown: { detection: 69, patch: 161 }

  scoring:
    red_verify: "flag_match"
    blue_verify: ["safe_probe"]

  artifacts: ["gov-esign-audit"]
  safety:
    profile: "hardened"
    notes: "HTTP 서비스형. read_only/tmpfs/cap_drop/mem_limit. 취약은 의도된 논스 재사용이며 실제 서명키 아님."
