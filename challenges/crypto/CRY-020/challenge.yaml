challenge:
  id: "CRY-020"
  title: "재난경보 위성 명령 업링크 - RSA e=3 관련 메시지(Franklin-Reiter)"
  category: "crypto"
  difficulty: "hard"
  points: { red: 260, blue: 260 }
  asset: "sat-uplink-rsa-fr"
  mitre: [T1552]

  description: |
    재난경보 위성 명령 업링크가 동일한 명령 페이로드 M 을 두 개의 연속 프레임으로 전송한다. 두 프레임은
    저비트 프레임 카운터만 다르므로 두 평문의 관계 m2 = m1 + delta (delta 공개) 가 성립하고, 두 프레임
    모두 작은 공개지수 e=3 으로 같은 모듈러스 N 에 대해 암호화된다. 이때 두 다항식
    g1(x)=x^3 - c1 과 g2(x)=(x+delta)^3 - c2 는 x=m1 을 공통근으로 가지므로, Z_N[x] 에서 다항식 GCD 를
    구하면 선형 인수 (x - m1) 가 남아 개인키 없이 m1 을 즉시 복구할 수 있다(Franklin-Reiter 관련 메시지
    공격). m1 에서 명령 토큰을 추출해 POST /api/recover 에 제출하면 flag.

  red_task:
    goal: "GET /api/frames 의 N,e=3,c1,c2,delta → 다항식 GCD(Franklin-Reiter)로 m1 복구 → 토큰 추출·제출"
    flag_format: "flag{...}"
    flag_type: "static"
    submit_fields: ["flag"]
    hints:
      - { cost: 10, text: "같은 평문의 두 관련 메시지(m2=m1+delta)가 e=3 으로 암호화됐다. 두 다항식이 x=m1 을 공통근으로 갖는다." }
      - { cost: 20, text: "g1(x)=x^3-c1, g2(x)=(x+delta)^3-c2. Z_N[x] 에서 유클리드 GCD 를 돌리면 차수가 1 로 떨어진다." }
      - { cost: 30, text: "최종 gcd = a·x + b → m1 = -b·a^-1 mod N. m1 을 바이트로 바꿔 토큰 접두어 뒤 페이로드를 읽어라." }

  blue_task:
    goal: "관련 메시지 재전송을 제거하고(프레임마다 무작위 OAEP 패딩) 동일 평문의 선형 관계 노출을 차단"
    success_criteria: |
      (1) 동일 명령이 알려진 선형 관계(m2=m1+delta)로 두 번 암호화되는지 관측 — 관측 시 Franklin-Reiter 로 복구 가능
      (2) 패치 후 프레임마다 무작위 패딩이 적용돼 두 평문 사이 알려진 대수 관계가 사라져 다항식 GCD 가 성립하지 않음
    points_breakdown: { detection: 78, patch: 182 }

  scoring:
    red_verify: "flag_match"
    blue_verify: ["safe_probe"]

  artifacts: ["sat-uplink-rsa-fr"]
  safety:
    profile: "hardened"
    notes: "HTTP 서비스형. read_only/tmpfs/cap_drop/mem_limit. 1024비트 RSA·e=3 은 훈련용 파라미터이며 실 위성키 아님."
