services:
  cry014_deploy:
    build: { context: . }
    container_name: cry014_deploy
    ports: ["8146:8146"]
    environment:
      - CHALLENGE_SECRET=${CHALLENGE_SECRET:-cry014-dev-secret}
      - PATCH_CRY_014=false
    mem_limit: 160m
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
