challenge:
  id: "CRY-012"
  title: "재난경보 방송 인증키 서버 - Pohlig-Hellman 이산로그 개인지수 복구"
  category: "crypto"
  difficulty: "hard"
  points: { red: 240, blue: 240 }
  asset: "alert-dlog-keyserver"
  mitre: [T1552]

  description: |
    전국 재난경보 방송망의 인증키 서버가 Diffie-Hellman 스타일 공개값을 게시한다.
    소수 p, 생성원 g, 그리고 개인지수 x 로 만든 공개값 h = g^x mod p 를 공개한다. 그러나 p 를
    잘못 선택해 p-1 이 작은 소인수들의 곱(smooth)이다. 이 경우 Pohlig-Hellman 알고리즘으로
    이산로그 x 를 각 소인수 부분군에서 BSGS 로 풀고 CRT 로 합쳐 개인지수를 복구할 수 있다.
    복구한 x 를 /api/recover 에 제출하면 flag.

  red_task:
    goal: "GET /api/params 의 (p,g,h) → p-1 인수분해(smooth) → 부분군별 BSGS + CRT 로 x 복구 → /api/recover"
    flag_format: "flag{...}"
    flag_type: "static"
    submit_fields: ["flag"]
    hints:
      - { cost: 10, text: "p-1 을 인수분해하라. 큰 소수 하나가 아니라 작은 소수들의 곱(smooth)이면 DLP 가 쉬워진다." }
      - { cost: 20, text: "각 소인수 q 에 대해 g^((p-1)/q), h^((p-1)/q) 로 부분군 DLP 를 BSGS 로 풀어 x mod q 를 구하라." }
      - { cost: 30, text: "부분군별 잔차를 CRT 로 합치면 x mod (p-1). x 를 10진수로 /api/recover 에 제출." }

  blue_task:
    goal: "safe prime(p=2q+1, q 소수)로 도메인 파라미터를 재생성해 p-1 을 non-smooth 로 만들어 Pohlig-Hellman 을 무력화"
    success_criteria: |
      (1) p-1 이 작은 소인수들의 곱(smooth)인지 관측 — smooth 하면 Pohlig-Hellman 으로 x 복구 가능
      (2) 패치 후 p 가 safe prime 이라 p-1=2q(q 대형 소수)로 부분군이 커져 이산로그 복구 불가
    points_breakdown: { detection: 72, patch: 168 }

  scoring:
    red_verify: "flag_match"
    blue_verify: ["safe_probe"]

  artifacts: ["alert-dlog-keyserver"]
  safety:
    profile: "hardened"
    notes: "HTTP 서비스형. read_only/tmpfs/cap_drop/mem_limit. 취약은 의도된 smooth 소수 선택이며 실 인증키 아님."
