services:
  cry012_deploy:
    build: { context: . }
    container_name: cry012_deploy
    ports: ["8144:8144"]
    environment:
      - CHALLENGE_SECRET=${CHALLENGE_SECRET:?requires CHALLENGE_SECRET}
      - PATCH_CRY_012=false
    mem_limit: 160m
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
