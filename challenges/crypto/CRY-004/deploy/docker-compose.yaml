services:
  cry004_deploy:
    build: { context: . }
    container_name: cry004_deploy
    ports: ["8136:8136"]
    environment:
      - CHALLENGE_SECRET=${CHALLENGE_SECRET:-cry004-dev-secret}
      - PATCH_CRY_004=false
    mem_limit: 160m
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
