challenge:
  id: "CRY-011"
  title: "펌웨어 매니페스트 서명기 - ECDSA 논스 재사용 개인키 복구"
  category: "crypto"
  difficulty: "hard"
  points: { red: 240, blue: 240 }
  asset: "firmware-ecdsa-signer"
  mitre: [T1552]

  description: |
    관제 시스템이 펌웨어 업데이트 매니페스트 두 건을 ECDSA(secp256k1)로 서명해 공개한다.
    그러나 서명 논스 k 를 두 메시지에 그대로 재사용한다. 논스가 같으면 두 서명의 r 이 동일하고,
    s1 - s2 = k^-1 (z1 - z2) 에서 k 를, 이어서 d = (s1·k - z1)·r^-1 에서 개인키 d 를 복구할 수
    있다(2010 PS3 결함과 동일). 복구한 개인키를 /api/recover 에 제출하면 flag.

  red_task:
    goal: "GET /api/signed 의 두 서명(같은 r) → k=(z1-z2)(s1-s2)^-1 → d=(s1·k-z1)r^-1 → /api/recover 로 flag"
    flag_format: "flag{...}"
    flag_type: "static"
    submit_fields: ["flag"]
    hints:
      - { cost: 10, text: "서로 다른 두 메시지의 서명에서 r 값을 비교하라. 같다면 무엇을 의미하나?" }
      - { cost: 20, text: "s1-s2 = k^-1(z1-z2) → k 복구. r 하나만 같아도 논스가 재사용된 것." }
      - { cost: 30, text: "k 를 알면 d = (s1·k - z1)·r^-1 mod n. d 를 hex 로 /api/recover 에 제출." }

  blue_task:
    goal: "메시지별 결정적 논스(RFC6979)로 재빌드해 r 재사용을 없애 개인키 복구를 차단"
    success_criteria: |
      (1) 서로 다른 메시지 서명의 r 이 동일한지(논스 재사용) 관측
      (2) 패치 후 논스가 메시지마다 달라 r 이 매번 다르고 개인키 복구 불가
    points_breakdown: { detection: 72, patch: 168 }

  scoring:
    red_verify: "flag_match"
    blue_verify: ["safe_probe"]

  artifacts: ["firmware-ecdsa-signer"]
  safety:
    profile: "hardened"
    notes: "HTTP 서비스형. read_only/tmpfs/cap_drop/mem_limit. 취약은 의도된 논스 재사용이며 실제 서명키 아님."
