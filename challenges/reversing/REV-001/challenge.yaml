challenge:
  id: "REV-001"
  title: "난독화된 라이선스 체크"
  category: "reversing"
  difficulty: "medium"
  points: { red: 150, blue: 0 }
  mitre: [T1027]
  description: |
    지상국 진단 도구에 시리얼 검증 로직이 있다. 검증 알고리즘(checker.py)은 공개되어
    있으니, 코드를 분석해 유효한 시리얼을 도출하라(바이너리 디스어셈블 없이 알고리즘
    리버싱에 집중하는 문제).
  red_task:
    goal: "checker.py의 검증 알고리즘을 분석해 팀 전용 유효 시리얼 도출"
    flag_format: "시리얼 형식 'XXXX-XXXX-XXXX-XXXX' 그 자체가 flag"
    hints:
      - { cost: 15, text: "checker.py의 각 단계(치환→XOR→체크섬)를 역순으로 밟아라." }
  scoring:
    red_verify: "detector_query"
  artifacts: ["checker.py"]
  safety:
    profile: "standard"
    notes: "합성 알고리즘. 실제 소프트웨어 라이선스 시스템과 무관."
