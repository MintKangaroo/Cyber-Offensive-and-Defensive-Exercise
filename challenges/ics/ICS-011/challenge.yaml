challenge:
  id: "ICS-011"
  title: "S7comm 안전 DB 무단 쓰기 분석 - 실 pcap 포렌식"
  category: "ics"
  difficulty: "hard"
  points: { red: 140, blue: 0 }
  mitre: [T0836, T0855]
  description: |
    s7_sabotage.pcap 은 스마트팩토리 S7 통신망의 **실 S7comm(TPKT/COTP/S7) 캡처**다(Wireshark
    가 포트 102 를 S7COMM 으로 디섹션). 정상 엔지니어링 스테이션(10.85.0.5)의 READ_VAR 폴링
    사이에, 무단 호스트가 안전 데이터블록(DB 62)에 WRITE_VAR 를 주입해 안전 로직 변수를 조작한
    사보타주가 숨어 있다. WRITE_VAR 데이터 페이로드가 토큰이다. DB 62 에 WRITE_VAR 를 내린 정상
    아닌 출발지를 찾아 공격자 IP 를 식별하고, 쓰기 데이터를 공격자 IP 로 XOR 복호해 flag 를 도출하라.
  red_task:
    goal: "안전 DB(62) S7 WRITE_VAR의 공격자 IP 식별 → 쓰기 데이터 XOR 복호 → flag"
    submit_fields: ["attacker_ip", "flag"]
  scoring:
    red_verify: "flag_match"
  artifacts: ["s7_sabotage.pcap"]
  safety:
    profile: "standard"
    notes: >
      실 S7comm 캡처(shared/ics/s7comm.py 실 인코더 + shared/net/pcap.py 프레이밍). 합성
      트래픽·합성 호스트(실장비/실네트워크 무관). IP·토큰·플래그는 팀별 동적 HMAC.
