challenge:
  id: "ICS-010"
  title: "EtherNet/IP CIP 무단 제어 분석 - 실 pcap 포렌식"
  category: "ics"
  difficulty: "hard"
  points: { red: 140, blue: 0 }
  mitre: [T0836, T0855, T0831]
  description: |
    enip_sabotage.pcap 은 스마트팩토리 산업이더넷의 **실 EtherNet/IP + CIP 캡처**다(Wireshark 가
    포트 44818 을 ENIP/CIP 로 디섹션). 정상 스캐너(10.80.0.5)의 GetAttributeSingle 폴링 사이에,
    무단 호스트가 안전 Assembly 오브젝트(class 0x04, instance 101)에 SetAttributeSingle 을 내려
    안전 어셈블리를 조작한 사보타주가 숨어 있다. CIP 요청 데이터에 토큰이 실려 있다. 안전
    Assembly 에 SetAttributeSingle 을 내린 정상 아닌 출발지를 찾아 공격자 IP 를 식별하고, CIP
    데이터를 공격자 IP 로 XOR 복호해 flag 를 도출하라.
  red_task:
    goal: "안전 Assembly 무단 SetAttributeSingle의 공격자 IP 식별 → CIP 데이터 XOR 복호 → flag"
    submit_fields: ["attacker_ip", "flag"]
  scoring:
    red_verify: "flag_match"
  artifacts: ["enip_sabotage.pcap"]
  safety:
    profile: "standard"
    notes: >
      실 EtherNet/IP CIP 캡처(shared/ics/enip.py 실 인코더 + shared/net/pcap.py 프레이밍).
      합성 트래픽·합성 호스트(실장비/실네트워크 무관). IP·토큰·플래그는 팀별 동적 HMAC.
