challenge:
  id: "ICS-001"
  title: "OPC UA 익명 태그 열람 - 실 OPC UA/TCP"
  category: "ics"
  difficulty: "easy"
  points: { red: 70, blue: 40 }
  mitre: [T0886]
  description: |
    보일러 컨트롤러가 **진짜 OPC UA 바이너리 프로토콜**(포트 4840)을 말한다. 목업 JSON 이
    아니라 실제 프로토콜이므로 UaExpert·opcua-client·python-opcua 가 그대로 붙는다.

    취약점: 익명 세션(인증 없음)이 허용되고 노드 접근 권한이 없다. 인증 없이
    ActivateSession(Anonymous)이 통과하고, Browse 로 주소공간 전체가 열거되며(은닉 진단
    노드 포함), 임의 노드를 Read 할 수 있다. 은닉 진단 노드(ns=4;s=Diag.Maint_*)를 익명으로
    Read 하면 그 값이 플래그다. 전부 실 OPC UA 위에서 회수된다.
  red_task:
    goal: "익명 세션→Browse 로 진단 노드(ns=4;s=Diag.Maint_*) 발견→익명 Read→플래그"
    flag_format: "flag{...}"
    flag_type: "dynamic"
    hints:
      - { cost: 5, text: "익명 세션(ActivateSession) 후 Browse 로 주소공간을 열거하라. Diag 노드가 보인다." }
      - { cost: 5, text: "발견한 ns=4;s=Diag.Maint_* 노드를 그대로 Read 하면 값이 플래그다." }
  blue_task:
    goal: "익명 세션 비활성화 + 노드 접근 권한(Role/UserTokenPolicy) 강제 + 진단 노드 접근 제한"
    success_criteria: "서술형 답변에 '익명' 또는 'anonymous' 키워드 포함"
  scoring:
    red_verify: "flag_match"
    blue_verify: "manual_review"
  artifacts: []
  safety:
    profile: "hardened"
    notes: >
      실 OPC UA/TCP 서버(shared/ics/opcua.py 재사용, 실장비 무관 합성 값). 인스턴스는 TEAM_ID
      귀속, 플래그는 팀별 동적 HMAC. 컨테이너 read_only+cap_drop ALL+비특권 포트(4840).
