version: "3.8"
services:
  ics001_deploy:
    build:
      context: .
    container_name: ics001_deploy
    ports:
      - "8111:8111"
    environment:
      - CHALLENGE_SECRET=${CHALLENGE_SECRET:-ics001-dev-secret}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: "256m"
    cpus: "0.5"
