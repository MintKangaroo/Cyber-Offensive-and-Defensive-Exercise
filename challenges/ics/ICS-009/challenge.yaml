challenge:
  id: "ICS-009"
  title: "Foundation Fieldbus MODE 조작 분석 - 실 pcap 포렌식"
  category: "ics"
  difficulty: "hard"
  points: { red: 140, blue: 0 }
  mitre: [T0836, T0855, T0831]
  description: |
    ff_h1_sabotage.pcap 은 정유 공정 필드버스망의 **실 Foundation Fieldbus H1 DLPDU** 캡처다. FF-H1
    은 시리얼 필드버스라 IP 가 아니어서 사설 EtherType(0x88FF)로 합성 캡슐화돼 있다(DLPDU 구조는
    실제). 정상 LAS/DCS(노드 0x10/0x11)의 파라미터 read 사이에, 무단 호스트가 안전 PID 블록
    (FIC-201)의 MODE_BLK.TARGET 을 O/S(Out-of-Service)로 write 해 제어를 무력화한 사보타주가 숨어
    있다. write DLSDU 에 토큰이 실려 있다. PID 블록에 MODE_BLK O/S write 를 낸 정상 아닌 노드주소를
    찾아 공격자 주소를 식별하고, 토큰을 공격자 주소로 XOR 복호해 flag 를 도출하라.
  red_task:
    goal: "PID 블록 MODE_BLK O/S 무단 write의 공격자 주소 식별 → 토큰 XOR 복호 → flag"
    submit_fields: ["attacker_addr", "flag"]
  scoring:
    red_verify: "flag_match"
  artifacts: ["ff_h1_sabotage.pcap"]
  safety:
    profile: "standard"
    notes: >
      실 FF-H1 DLPDU(shared/ics/ff_h1.py 실 인코더) + 사설 EtherType 합성 캡슐화(shared/net/pcap.py).
      합성 트래픽·합성 호스트(실장비/실네트워크 무관). 주소·토큰·플래그는 팀별 동적 HMAC.
