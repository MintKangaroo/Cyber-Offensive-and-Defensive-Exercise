challenge:
  id: "ICS-008"
  title: "BACnet 무단 WriteProperty 분석 - Priority Override"
  category: "ics"
  difficulty: "medium"
  points: { red: 120, blue: 0 }
  mitre: [T0855, T0836]
  description: |
    bacnet_traffic.jsonl은 데이터센터 건물자동화망(BAS)의 합성 BACnet/IP 트래픽 로그다. 정상
    BMS 워크스테이션(10.70.0.10)의 읽기(ReadProperty, service 12) 사이에, 무단 장치가 냉방
    제어 객체(analog-output, CRAC 급기온도 setpoint)에 WriteProperty(service 15)를 priority 8
    이상(수동 오버라이드 우선순위)으로 내려 냉방을 끄는 사보타주가 숨어 있다. 정상 BMS가 아닌
    출발지에서 analog-output 객체에 대한 WriteProperty를 찾아 공격자 IP를 식별하고, note(base64)
    토큰을 공격자 IP로 XOR 복호해 flag를 도출하라.
  red_task:
    goal: "냉방 객체에 대한 무단 BACnet WriteProperty의 공격자 IP 식별 → note 토큰 XOR 복호 → flag"
    submit_fields: ["attacker_ip", "flag"]
  scoring:
    red_verify: "flag_match"
  artifacts: ["bacnet_traffic.jsonl"]
  safety:
    profile: "standard"
    notes: "합성 BACnet/IP 로그(실트래픽/실장비 무관). IP/토큰/플래그는 팀별 더미값."
