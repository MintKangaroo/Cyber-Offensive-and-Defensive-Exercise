challenge:
  id: "ICS-008"
  title: "BACnet 무단 WriteProperty 분석 - 실 pcap 포렌식"
  category: "ics"
  difficulty: "medium"
  points: { red: 120, blue: 0 }
  mitre: [T0855, T0836]
  description: |
    bacnet_sabotage.pcap 은 데이터센터 BMS 망의 **실 BACnet/IP 캡처**다(Wireshark 가 UDP 47808 을
    BACnet 으로 디섹션). 정상 BMS(10.70.0.10)의 ReadProperty 폴링 사이에, 무단 장치가 냉방
    setpoint 오브젝트(analog-output)에 WriteProperty(priority 8, 수동 오버라이드)를 내린 사보타주가
    숨어 있다. WriteProperty 값(OctetString)에 토큰이 실려 있다. 냉방 오브젝트에 WriteProperty 를
    내린 정상 아닌 출발지를 찾아 공격자 IP 를 식별하고, 값을 공격자 IP 로 XOR 복호해 flag 를 도출하라.
  red_task:
    goal: "냉방 오브젝트 무단 WriteProperty의 공격자 IP 식별 → 값 XOR 복호 → flag"
    submit_fields: ["attacker_ip", "flag"]
  scoring:
    red_verify: "flag_match"
  artifacts: ["bacnet_sabotage.pcap"]
  safety:
    profile: "standard"
    notes: >
      실 BACnet/IP 캡처(shared/ics/bacnet.py 실 인코더 + shared/net/pcap.py 프레이밍). 합성
      트래픽·합성 호스트(실장비/실네트워크 무관). IP·토큰·플래그는 팀별 동적 HMAC.
