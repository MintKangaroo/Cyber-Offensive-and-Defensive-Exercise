services:
  web020_deploy:
    build:
      context: .
    container_name: web020_deploy
    ports:
      - "8120:8120"
    environment:
      - CHALLENGE_SECRET=${CHALLENGE_SECRET:-web020-dev-secret}
      - PATCH_WEB_020=false
    mem_limit: 200m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
