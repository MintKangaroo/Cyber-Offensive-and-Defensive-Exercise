services:
  web021_deploy:
    build:
      context: .
    container_name: web021_deploy
    ports:
      - "8122:8121"
    environment:
      - CHALLENGE_SECRET=${CHALLENGE_SECRET:-web021-dev-secret}
      - PATCH_WEB_021=false
    mem_limit: 128m
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
