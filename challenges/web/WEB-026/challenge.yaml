challenge:
  id: "WEB-026"
  title: "스마트팜 관제 설정 임포트 - YAML 역직렬화 RCE"
  category: "web"
  difficulty: "hard"
  points: { red: 200, blue: 200 }
  asset: "smartfarm"
  mitre: [T1190, T1059]

  description: |
    농식품/스마트팜 관제 시스템이 설정을 YAML 로 임포트하는데 PyYAML 의 안전하지 않은 로더를
    사용한다. !!python/object/apply 태그로 임의 파이썬 호출을 유발해(역직렬화 RCE) 서버의
    /app/flag.txt 를 읽어라. (신규 취약점 유형 — YAML 역직렬화; WEB-005 pickle RCE 와 구분)

  red_task:
    goal: "설정 임포트에 악성 YAML 태그를 넣어 임의 명령을 실행하고 /app/flag.txt 를 응답에 반영"
    flag_format: "flag{...}"
    flag_type: "static"
    submit_fields: ["flag"]
    hints:
      - { cost: 10, text: "POST /api/config/import 는 YAML 을 파싱해 결과를 되돌린다. 어떤 로더일까?" }
      - { cost: 25, text: "PyYAML 의 unsafe 로더는 !!python/object/apply 로 함수 호출을 만든다." }
      - { cost: 40, text: '!!python/object/apply:subprocess.check_output [["cat","/app/flag.txt"]]' }

  blue_task:
    goal: "yaml.safe_load 로 전환해 역직렬화 RCE 차단"
    success_criteria: |
      (1) 업로드 YAML 에 !!python/ 태그가 포함된 요청 관측
      (2) 패치(PATCH_WEB_026=true) 후 태그가 실행되지 않아 파일 유출 불가
    points_breakdown: { detection: 60, patch: 140 }

  scoring:
    red_verify: "flag_match"
    blue_verify: ["safe_probe"]

  artifacts: []
  safety:
    profile: "hardened"
    notes: "실제 코드 실행 발생. cap_drop/no-new-privileges/mem_limit 하드닝, 더미 데이터."
