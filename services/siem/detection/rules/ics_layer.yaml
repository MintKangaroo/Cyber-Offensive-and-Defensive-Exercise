# ICS 계층 탐지 규칙(P1-1 red→blue) — 실제 Modbus 공격을 Blue 가 탐지.
# 트윈이 Modbus 쓰기를 SIEM access 로그로 흘리면, 이 규칙이 매칭 → blue_detection_success → 점수.

- id: ICS-MODBUS-WRITE-PP
  title: "ICS 미인가 Modbus 쓰기 - 발전소"
  severity: 4
  mitre: [T0836, T0855]        # Modify Parameter, Unauthorized Command
  source_type: twin
  kind: match
  match:
    vuln_id: "PP-006"

# §5 실 프로토콜 확장: DNP3 DIRECT_OPERATE(제어)는 정찰(READ)과 달리 미인가 제어 공격이다.
# 트윈 access 로그의 raw.protocol=dnp3(=on_operate 시에만 기록)로 탐지 → SIS 무력화 포착.
- id: ICS-DNP3-CONTROL-PP
  title: "ICS 미인가 DNP3 제어 - 발전소 SIS 무력화"
  severity: 5
  mitre: [T0855, T0858]        # Unauthorized Command, Manipulation of Control
  source_type: twin
  kind: match
  match:
    raw.protocol: "dnp3"

# §5 실 프로토콜 확장: 미인증 OPC UA 접속(security None SecureChannel 개설)은 DCS/SIS 정찰.
- id: ICS-OPCUA-ANON-CONNECT
  title: "ICS 미인증 OPC UA 접속 - DCS/SIS 정찰"
  severity: 4
  mitre: [T0846, T0888]        # Remote System Discovery, Remote System Information Discovery
  source_type: twin
  kind: match
  match:
    raw.protocol: "opcua"

# §5 실 프로토콜 확장: 미인증 S7 Read Var(PLC 메모리 열람)은 Siemens PLC 정찰(Stuxnet 계열).
- id: ICS-S7-READ-FAC
  title: "ICS 미인증 S7 PLC 메모리 열람 - 스마트팩토리 정찰"
  severity: 4
  mitre: [T0888, T0861]        # Remote System Info Discovery, Point & Tag Identification
  source_type: twin
  kind: match
  match:
    raw.protocol: "s7comm"

