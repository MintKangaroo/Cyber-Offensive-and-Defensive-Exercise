# 클라우드 네이티브 공격면 탐지 규칙(cloud_native 트윈) — MITRE ATT&CK Enterprise.
# 트윈이 vuln_id(CLD-*) 로 SIEM access 로그를 발행하면 매칭 → blue_detection_success.

