# §5 실 프로토콜 확장: EtherNet/IP + CIP(Rockwell/Allen-Bradley PLC) 탐지 규칙.
# 트윈이 실제 ENIP 캡슐화 CIP(포트 44818)로 SetAttributeSingle 를 받으면 raw.protocol=enip 로
# SIEM access 로그를 흘린다. 미인가 SetAttributeSingle = PLC 태그/속성 직접 쓰기(제어 변조).
- id: ICS-ENIP-CIP-SETATTR
  title: "ICS 미인가 EtherNet/IP CIP SetAttributeSingle - PLC 제어 쓰기"
  severity: 4
  mitre: [T0855, T0836]        # Unauthorized Command Message, Modify Parameter
  source_type: twin
  kind: match
  match:
    raw.protocol: "enip"
