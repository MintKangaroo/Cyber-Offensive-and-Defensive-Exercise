# Cyber Range 통합 개발용 오케스트레이션 (17번 문서 구조 / 단일 모노레포)
# ---------------------------------------------------------------------------
# 이전에는 cyber-range / cyber-range-contracts 두 리포를 형제 디렉토리로 두고
# context: ../cyber-range-contracts 로 참조했지만, 이제 하나의 리포로 합쳐졌으므로
# 모든 build context 는 리포 루트(.) 하나로 단순화된다.
#
# 각 디지털 트윈은 독립 네트워크(twin_*)로 격리하고, 코어 서비스와는
# range_control 네트워크로만 통신한다(이벤트/점수/패치/텔레메트리 전용 경로).
version: "3.8"

x-ad-service-security: &ad-service-security
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  mem_limit: 256m
  cpus: 0.50
  restart: unless-stopped

services:
  # 감사 2.5/4.3 fix: siem_logs 섹터 subpath는 디렉터리가 미리 있어야 마운트되고, 비root
  # 서비스(팀 서비스 uid65532 등)가 쓰려면 권한이 필요하다. 이 init이 전 섹터 디렉터리를
  # 생성+개방(777)한 뒤 종료하며, siem_logs를 쓰는 모든 서비스가 이를 먼저 기다린다.
  siem_logs_init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - >-
        mkdir -p /v/ground_station /v/power_plant /v/defense_network /v/refinery_plant /v/smart_factory /v/water_utility /v/lng_terminal /v/railway_signaling /v/airport_ot /v/datacenter_bms /v/hospital_ot /v/cloud_native /v/attack_defense && chmod 777 /v /v/*
    volumes:
      - siem_logs:/v
    restart: "no"

  event_collector:
    mem_limit: 512m
    cpus: "0.75"
    build: { context: ., dockerfile: services/event_collector/Dockerfile }
    container_name: event_collector
    volumes:
      - ec_data:/data
    environment:
      - DATA_DIR=/data
      - SERVICE_TOKEN=${SERVICE_TOKEN:-}          # 감사 3.1: ingest 토큰 게이트
      - RBAC_ALLOW_INSECURE_DEV=${RBAC_ALLOW_INSECURE_DEV:-}
    ports: ["8010:8010"]
    # 격리된 트윈들이 이벤트를 보낼 수 있도록 각 twin_* internal 네트워크에도 연결.
    networks: [range_control]


  # 감사 3.2: 트윈망↔채점망 분리용 ingest 프록시. 트윈은 이 프록시로만 이벤트를 보내고,
  # 프록시가 range_control의 event_collector로 포워딩 + S2S 토큰 주입. event_collector는
  # 트윈망에서 제거되어 트윈이 직접 도달 불가(isolation_test 검증).
  ingest_proxy:
    image: nginx:1.29-alpine
    container_name: ingest_proxy
    mem_limit: 128m
    cpus: "0.50"
    environment:
      - SERVICE_TOKEN=${SERVICE_TOKEN:-}
    volumes:
      - ./infra/ingest_proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on: [event_collector]
    networks: [range_control, twin_ground_station, twin_power_plant, twin_defense_network, twin_refinery_plant, twin_smart_factory, twin_water_utility, twin_lng_terminal, twin_railway_signaling, twin_airport_ot, twin_datacenter_bms, twin_hospital_ot]
  scoring_engine:
    mem_limit: 512m
    cpus: "0.75"
    build: { context: ., dockerfile: services/scoring_engine/Dockerfile }
    container_name: scoring_engine
    volumes:
      - sc_data:/data
    ports: ["8020:8020"]
    environment:
      - SERVICE_TOKEN=${SERVICE_TOKEN:-}
      # /score/adjust(수동 점수조정) RBAC용. 토큰 미설정 시 dev 모드로 열리므로 반드시 주입.
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-}
      - RBAC_ALLOW_INSECURE_DEV=${RBAC_ALLOW_INSECURE_DEV:-}
      - RED_TOKEN=${RED_TOKEN:-}
      - BLUE_TOKEN=${BLUE_TOKEN:-}
      - OBSERVER_TOKEN=${OBSERVER_TOKEN:-}
      # 관전자 read 게이트(기본 off = 공개). true 시 /scores 등 read에 유효 토큰 요구.
      - OBSERVER_READ_ENFORCE=${OBSERVER_READ_ENFORCE:-}
      - DATA_DIR=/data
    networks: [range_control]

  config_service:
    mem_limit: 512m
    cpus: "0.75"
    build: { context: ., dockerfile: services/config_service/Dockerfile }
    container_name: config_service
    volumes:
      - cf_data:/data
    ports: ["8030:8030"]
    environment:
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-}
      - RBAC_ALLOW_INSECURE_DEV=${RBAC_ALLOW_INSECURE_DEV:-}
      - RED_TOKEN=${RED_TOKEN:-}
      - BLUE_TOKEN=${BLUE_TOKEN:-}
      - OBSERVER_TOKEN=${OBSERVER_TOKEN:-}
      - DATA_DIR=/data
    # 격리된 트윈들이 패치 상태를 폴링할 수 있도록 각 twin_* 네트워크에도 연결.
    networks: [range_control, twin_ground_station, twin_power_plant, twin_defense_network, twin_refinery_plant, twin_smart_factory, twin_water_utility, twin_lng_terminal, twin_railway_signaling, twin_airport_ot, twin_datacenter_bms, twin_hospital_ot]

  edr_backend:
    mem_limit: 512m
    cpus: "0.75"
    build: { context: ., dockerfile: services/edr/Dockerfile }
    container_name: edr_backend
    volumes:
      - edr_data:/data
    ports: ["8080:8080"]
    environment:
      - CONFIG_SERVICE_URL=http://config_service:8030
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-}
      - RBAC_ALLOW_INSECURE_DEV=${RBAC_ALLOW_INSECURE_DEV:-}
      - RED_TOKEN=${RED_TOKEN:-}
      - BLUE_TOKEN=${BLUE_TOKEN:-}
      - OBSERVER_TOKEN=${OBSERVER_TOKEN:-}
      # 관전자 read 게이트(기본 off = 공개). true 시 /edr/hosts 등 read에 유효 토큰 요구.
      - OBSERVER_READ_ENFORCE=${OBSERVER_READ_ENFORCE:-}
      - DATA_DIR=/data
    depends_on: [config_service]
    # 격리된 트윈의 EDR 에이전트가 텔레메트리를 보낼 수 있도록 각 twin_* 네트워크에도 연결.
    networks: [range_control, twin_ground_station, twin_power_plant, twin_defense_network, twin_refinery_plant, twin_smart_factory, twin_water_utility, twin_lng_terminal, twin_railway_signaling, twin_airport_ot, twin_datacenter_bms, twin_hospital_ot]

  siem_api:
    mem_limit: 512m
    cpus: "0.75"
    build: { context: ., dockerfile: services/siem/Dockerfile }
    container_name: siem_api
    ports:
      - "8040:8040"
      - "1514:1514/udp"   # syslog 수신(26번 문서 5절)
    environment:
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-}          # 감사 4.6: 라운드 리셋 인증
      - RBAC_ALLOW_INSECURE_DEV=${RBAC_ALLOW_INSECURE_DEV:-}
      - SERVICE_TOKEN=${SERVICE_TOKEN:-}
      - SIEM_LOG_DIR=/var/log/siem
      - SYSLOG_UDP_PORT=1514
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - PUSH_TO_LIVEFIRE=true
      - INCIDENT_URL=http://incident:8095
      - INCIDENT_AUTO_PROMOTE=true
      - INCIDENT_MIN_SEVERITY=4
      - SIEM_NOISE_ENABLED=false
      - SIEM_NOISE_EPS=2.0
      - DATA_DIR=/data
      - SIEM_DB_PATH=/data/siem.db
      - SIEM_ALERT_DB_PATH=/data/siem_alerts.db
    volumes:
      - si_data:/data
      - siem_logs:/var/log/siem:ro
    depends_on:
      event_collector:
        condition: service_started
      siem_logs_init:
        condition: service_completed_successfully
    networks: [range_control]

  scenario_engine:
    mem_limit: 512m
    cpus: "0.75"
    build: { context: ., dockerfile: services/scenario_engine/Dockerfile }
    container_name: scenario_engine
    ports: ["8045:8045"]
    environment:
      - SERVICE_TOKEN=${SERVICE_TOKEN:-}
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - EVENT_COLLECTOR_WS_URL=ws://event_collector:8010/ws
      - CONFIG_SERVICE_URL=http://config_service:8030
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-}
      - RBAC_ALLOW_INSECURE_DEV=${RBAC_ALLOW_INSECURE_DEV:-}
    depends_on: [event_collector, config_service]
    networks: [range_control]

  instructor_api:
    mem_limit: 512m
    cpus: "0.75"
    build: { context: ., dockerfile: services/instructor_api/Dockerfile }
    container_name: instructor_api
    volumes:
      - in_data:/data
    ports: ["8050:8050"]
    environment:
      - SERVICE_TOKEN=${SERVICE_TOKEN:-}
      - SCENARIO_ENGINE_URL=http://scenario_engine:8045
      - SCORING_ENGINE_URL=http://scoring_engine:8020
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-}
      - RBAC_ALLOW_INSECURE_DEV=${RBAC_ALLOW_INSECURE_DEV:-}
      - RED_TOKEN=${RED_TOKEN:-}
      - BLUE_TOKEN=${BLUE_TOKEN:-}
      - OBSERVER_TOKEN=${OBSERVER_TOKEN:-}
      - DATA_DIR=/data
    depends_on: [scenario_engine, scoring_engine, event_collector]
    networks: [range_control]

  aar_report:
    mem_limit: 512m
    cpus: "0.75"
    build: { context: ., dockerfile: services/aar_report/Dockerfile }
    container_name: aar_report
    ports: ["8090:8090"]
    environment:
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - SCORING_ENGINE_URL=http://scoring_engine:8020
      - SIEM_API_URL=http://siem_api:8040
      - INCIDENT_URL=http://incident:8095
      - INJECTS_URL=http://injects:8096
      - CHALLENGE_PORTAL_URL=http://challenge_portal:8060
      - AAR_PDF_DIR=/data/aar_reports              # 감사 4.8: 영속 볼륨에 PDF 저장
      - AAR_RETENTION_DAYS=${AAR_RETENTION_DAYS:-14}
      - AAR_MAX_REPORTS=${AAR_MAX_REPORTS:-500}
    volumes:
      - aar_data:/data                              # 감사 4.8: PDF 영속(재기동/재배포 후 보존)
    depends_on: [event_collector, scoring_engine]
    networks: [range_control]

  # NOC 모니터: 트윈 /health 폴링 + Recovery Watcher(04번 2절).
  # asset_compromised 이력 + 취약점 patched + 3회 연속 정상 -> asset_recovered(+50) 발행.
  # 트윈 상태를 폴링해야 하므로 각 twin_* 네트워크와 range_control 모두에 연결.
  match_proxy:
    mem_limit: 192m
    cpus: "0.50"
    image: nginx:1.29-alpine
    container_name: match_proxy
    ports: ["8088:8088"]
    volumes: [ ./infra/match/match_proxy.conf:/etc/nginx/conf.d/default.conf:ro ]
    networks: [range_control]

  range_control:
    mem_limit: 512m
    cpus: "0.75"
    build: { context: ., dockerfile: services/range_control/Dockerfile }
    container_name: range_control
    volumes:
      - rc_data:/data
    ports: ["8055:8055"]
    environment:
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - SCORING_ENGINE_URL=http://scoring_engine:8020
      - CONFIG_SERVICE_URL=http://config_service:8030
      - SIEM_API_URL=http://siem_api:8040
      - CHALLENGE_PORTAL_URL=http://challenge_portal:8060
      - EDR_BACKEND_URL=http://edr_backend:8080
      - INCIDENT_URL=http://incident:8095       # 감사 4.6: 라운드 리셋 대상
      - INJECTS_URL=http://injects:8096          # 감사 4.6: 라운드 리셋 대상
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-}
      - RBAC_ALLOW_INSECURE_DEV=${RBAC_ALLOW_INSECURE_DEV:-}
      - DATA_DIR=/data
    depends_on: [event_collector, scoring_engine, config_service, challenge_portal]
    networks: [range_control]

  auth:
    mem_limit: 512m
    cpus: "0.75"
    build: { context: ., dockerfile: services/auth/Dockerfile }
    container_name: auth
    ports: ["8051:8051"]
    environment:
      - DATA_DIR=/data
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-}
      - AUTH_ADMIN_PASSWORD=${AUTH_ADMIN_PASSWORD:-}
    volumes: [ auth_data:/data ]
    networks: [range_control]

  incident:
    mem_limit: 512m
    cpus: "0.75"
    build: { context: ., dockerfile: services/incident/Dockerfile }
    container_name: incident
    ports: ["8095:8095"]
    environment:
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-}          # 감사 4.6: 라운드 리셋 인증
      - RBAC_ALLOW_INSECURE_DEV=${RBAC_ALLOW_INSECURE_DEV:-}
      - SERVICE_TOKEN=${SERVICE_TOKEN:-}
      - DATA_DIR=/data
      - EVENT_COLLECTOR_URL=http://event_collector:8010
    volumes: [ inc_case_data:/data ]
    depends_on: [event_collector]
    networks: [range_control]

  injects:
    mem_limit: 512m
    cpus: "0.75"
    build: { context: ., dockerfile: services/injects/Dockerfile }
    container_name: injects
    ports: ["8096:8096"]
    environment:
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-}          # 감사 4.6: 라운드 리셋 인증
      - RBAC_ALLOW_INSECURE_DEV=${RBAC_ALLOW_INSECURE_DEV:-}
      - SERVICE_TOKEN=${SERVICE_TOKEN:-}
      - DATA_DIR=/data
      - EVENT_COLLECTOR_URL=http://event_collector:8010
    volumes: [ injects_data:/data ]
    depends_on: [event_collector]
    networks: [range_control]

  observability:
    mem_limit: 512m
    cpus: "0.75"
    build: { context: ., dockerfile: services/observability/Dockerfile }
    container_name: observability
    ports: ["8097:8097"]
    networks: [range_control, ad_scoreboard_api]

  # DEF CON-style symmetric Attack/Defense mode. This is an additive service;
  # legacy exercise services and their databases remain unchanged.
  attack_defense:
    build: { context: ., dockerfile: services/attack_defense/Dockerfile }
    container_name: attack_defense
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    ports: ["8100:8100"]
    volumes:
      - ad_data:/data
    environment:
      - ATTACK_DEFENSE_ENABLED=${ATTACK_DEFENSE_ENABLED:-true}
      - ATTACK_DEFENSE_DATA_DIR=/data
      - ATTACK_DEFENSE_FLAG_SECRET=${ATTACK_DEFENSE_FLAG_SECRET:-attack-defense-dev-flag-secret-change-me}
      - ATTACK_DEFENSE_FLAG_HASH_SECRET=${ATTACK_DEFENSE_FLAG_HASH_SECRET:-attack-defense-dev-hash-secret-change-me}
      - ATTACK_DEFENSE_MANAGEMENT_TOKEN=${ATTACK_DEFENSE_MANAGEMENT_TOKEN:-attack-defense-dev-management-token}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-}
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-}
      - RBAC_ALLOW_INSECURE_DEV=${RBAC_ALLOW_INSECURE_DEV:-}
      - OPERATOR_TOKEN=${OPERATOR_TOKEN:-}
      - ROUND_DURATION_SECONDS=${ROUND_DURATION_SECONDS:-120}
      - ACTIVE_FLAG_WINDOW_ROUNDS=${ACTIVE_FLAG_WINDOW_ROUNDS:-3}
      - CHECK_INTERVAL_SECONDS=${CHECK_INTERVAL_SECONDS:-30}
      - CHECK_TIMEOUT_SECONDS=${CHECK_TIMEOUT_SECONDS:-10}
      - CHECK_RETRY_COUNT=${CHECK_RETRY_COUNT:-2}
      - SCOREBOARD_DELAY_ROUNDS=${SCOREBOARD_DELAY_ROUNDS:-0}
      - ATTACK_SCORE_PER_FLAG=${ATTACK_SCORE_PER_FLAG:-10}
      - DEFENSE_SCORE_PER_FLAG=${DEFENSE_SCORE_PER_FLAG:-5}
      - AVAILABILITY_SCORE_PER_ROUND=${AVAILABILITY_SCORE_PER_ROUND:-5}
      - KOTH_DEFAULT_LEASE_ROUNDS=${KOTH_DEFAULT_LEASE_ROUNDS:-2}
      - KOTH_DEFAULT_POINTS_PER_ROUND=${KOTH_DEFAULT_POINTS_PER_ROUND:-3}
      - STEALTH_ALERT_DELAY_ROUNDS=${STEALTH_ALERT_DELAY_ROUNDS:-2}
      - STEALTH_DETECTION_WINDOW_ROUNDS=${STEALTH_DETECTION_WINDOW_ROUNDS:-2}
      - STEALTH_ATTACKER_UNDETECTED_POINTS=${STEALTH_ATTACKER_UNDETECTED_POINTS:-2}
      - STEALTH_DEFENDER_DETECTION_POINTS=${STEALTH_DEFENDER_DETECTION_POINTS:-2}
      - MAX_STEALTH_REPORTS_PER_MINUTE=${MAX_STEALTH_REPORTS_PER_MINUTE:-30}
      - MAX_FLAG_SUBMISSIONS_PER_MINUTE=${MAX_FLAG_SUBMISSIONS_PER_MINUTE:-120}
      - MAX_PATCH_SUBMISSIONS_PER_HOUR=${MAX_PATCH_SUBMISSIONS_PER_HOUR:-10}
      - PATCH_VALIDATION_TIMEOUT_SECONDS=${PATCH_VALIDATION_TIMEOUT_SECONDS:-180}
      - PATCH_MAX_IMAGE_SIZE_MB=${PATCH_MAX_IMAGE_SIZE_MB:-1024}
      - PATCH_ALLOWED_REGISTRY=${PATCH_ALLOWED_REGISTRY:-registry.local:5000}
      - PATCH_RUNTIME_REGISTRY=${PATCH_RUNTIME_REGISTRY:-localhost:5000}
      - GAME_RUNTIME=${GAME_RUNTIME:-docker_compose}
      - PCAP_STORAGE_DIR=/data/captures
      - PCAP_RELEASE_DELAY_SECONDS=${PCAP_RELEASE_DELAY_SECONDS:-900}
      - PCAP_MAX_UPLOAD_MB=${PCAP_MAX_UPLOAD_MB:-32}
      - PCAP_MAX_PACKETS=${PCAP_MAX_PACKETS:-250000}
      - PCAP_MAX_DOWNLOADS_PER_MINUTE=${PCAP_MAX_DOWNLOADS_PER_MINUTE:-10}
      - PCAP_MAX_FUTURE_SKEW_SECONDS=${PCAP_MAX_FUTURE_SKEW_SECONDS:-300}
      - PCAP_ANONYMIZATION_SECRET=${PCAP_ANONYMIZATION_SECRET:-attack-defense-dev-pcap-anonymize-change-me}
      - PCAP_WATERMARK_SECRET=${PCAP_WATERMARK_SECRET:-attack-defense-dev-pcap-watermark-change-me}
    depends_on:
      - ad_team_01_notes
      - ad_team_01_vault
      - ad_team_02_notes
      - ad_team_02_vault
      - ad_team_03_notes
      - ad_team_03_vault
      - ad_registry
    networks: [range_control, ad_management, ad_scoreboard_api, ad_team_access]

  # Optional PostgreSQL-backed replicated API/game-engine profile. The bundled
  # loopback HAProxy is for local verification only; production must supply
  # authenticated TLS ingress. Do not run it beside the default SQLite
  # `attack_defense` service for the same Match.
  ad_postgres:
    profiles: ["ad-ha"]
    image: postgres:17-alpine
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    security_opt: ["no-new-privileges:true"]
    shm_size: 128m
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    environment:
      POSTGRES_USER: attack_defense
      POSTGRES_PASSWORD: ${AD_POSTGRES_PASSWORD:-ad-ha-dev-password-change-me}
      POSTGRES_DB: attack_defense
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - ad_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attack_defense -d attack_defense"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [ad_management]

  attack_defense_ha:
    profiles: ["ad-ha"]
    build: { context: ., dockerfile: services/attack_defense/Dockerfile }
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    expose: ["8100"]
    volumes:
      - ad_ha_data:/data
    environment:
      ATTACK_DEFENSE_ENABLED: "true"
      ATTACK_DEFENSE_DATA_DIR: /data
      ATTACK_DEFENSE_DATABASE_URL: postgresql://attack_defense:${AD_POSTGRES_PASSWORD:-ad-ha-dev-password-change-me}@ad_postgres:5432/attack_defense
      ATTACK_DEFENSE_DB_CONNECT_TIMEOUT_SECONDS: ${ATTACK_DEFENSE_DB_CONNECT_TIMEOUT_SECONDS:-5}
      ATTACK_DEFENSE_DB_STATEMENT_TIMEOUT_MS: ${ATTACK_DEFENSE_DB_STATEMENT_TIMEOUT_MS:-10000}
      ATTACK_DEFENSE_MAX_DB_CLOCK_SKEW_SECONDS: ${ATTACK_DEFENSE_MAX_DB_CLOCK_SKEW_SECONDS:-5}
      ATTACK_DEFENSE_FLAG_SECRET: ${ATTACK_DEFENSE_FLAG_SECRET:-attack-defense-dev-flag-secret-change-me}
      ATTACK_DEFENSE_FLAG_HASH_SECRET: ${ATTACK_DEFENSE_FLAG_HASH_SECRET:-attack-defense-dev-hash-secret-change-me}
      ATTACK_DEFENSE_MANAGEMENT_TOKEN: ${ATTACK_DEFENSE_MANAGEMENT_TOKEN:-attack-defense-dev-management-token}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      INSTRUCTOR_TOKEN: ${INSTRUCTOR_TOKEN:-}
      RBAC_ALLOW_INSECURE_DEV: ${RBAC_ALLOW_INSECURE_DEV:-}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      ROUND_DURATION_SECONDS: ${ROUND_DURATION_SECONDS:-120}
      ACTIVE_FLAG_WINDOW_ROUNDS: ${ACTIVE_FLAG_WINDOW_ROUNDS:-3}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-30}
      CHECK_TIMEOUT_SECONDS: ${CHECK_TIMEOUT_SECONDS:-10}
      CHECK_RETRY_COUNT: ${CHECK_RETRY_COUNT:-2}
