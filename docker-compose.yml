networks:
  # 트윈 격리 네트워크(로드맵 F ★★★): internal:true 로 인터넷 egress 차단.
  # 각 트윈은 자기 네트워크에만 있고 코어 서비스(event_collector/config_service/edr_backend)만
  # 함께 붙어 있어, 트윈→코어 통신은 되지만 트윈끼리(lateral)·외부(egress)는 도달 불가.
  twin_ground_station: { driver: bridge, internal: true }
  twin_power_plant: { driver: bridge, internal: true }
  twin_defense_network: { driver: bridge, internal: true }
  twin_refinery_plant: { driver: bridge, internal: true }
  twin_smart_factory: { driver: bridge, internal: true }
  twin_water_utility: { driver: bridge, internal: true }
  twin_lng_terminal: { driver: bridge, internal: true }
  twin_railway_signaling: { driver: bridge, internal: true }
  twin_airport_ot: { driver: bridge, internal: true }
  twin_datacenter_bms: { driver: bridge, internal: true }
  twin_hospital_ot: { driver: bridge, internal: true }
  range_control: { driver: bridge }
  # Logical A/D planes. Docker Compose cannot enforce directional egress;
  # production NetworkPolicy examples live under infra/attack_defense/.
  ad_team_access: { driver: bridge }
  ad_game_attack: { driver: bridge, internal: true }
  ad_scoreboard_api: { driver: bridge }
  ad_management: { driver: bridge, internal: true }
  # Host-side push/pull path. Game service containers are deliberately absent.
  ad_registry_host: { driver: bridge }

volumes:
  auth_data: {}
  inc_case_data: {}
  injects_data: {}
  ec_data: {}
