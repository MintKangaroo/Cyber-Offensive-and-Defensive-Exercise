    cap_add: ["NET_ADMIN", "NET_RAW"]
    volumes:
      - ./infra/zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
      - type: volume
        source: siem_logs
        target: /var/log/siem/datacenter_bms
        volume:
          subpath: datacenter_bms
    working_dir: /var/log/siem/datacenter_bms
    entrypoint: ["sh", "-c", "mkdir -p /var/log/siem/datacenter_bms && cd /var/log/siem/datacenter_bms && zeek -i eth0 local"]
    depends_on:
      datacenter_bms:
        condition: service_started
      siem_logs_init:
        condition: service_completed_successfully

  hsp_suricata:
    mem_limit: 768m
    cpus: "1.0"
    image: jasonish/suricata@sha256:d646d24be0e9cc7c168e36f424d9b7496f6d1d6794ddfbcc35b3f6e973ed0f69
    container_name: hsp_suricata
    network_mode: "service:hospital_ot"
    cap_add: ["NET_ADMIN", "NET_RAW"]
    volumes:
      - ./infra/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./infra/suricata/custom.rules:/etc/suricata/rules/custom.rules:ro
      - type: volume
        source: siem_logs
        target: /var/log/siem/hospital_ot
        volume:
          subpath: hospital_ot
    entrypoint: ["sh", "-c", "mkdir -p /var/log/siem/hospital_ot && suricata -c /etc/suricata/suricata.yaml -l /var/log/siem/hospital_ot -i eth0"]
    depends_on:
      hospital_ot:
        condition: service_started
      siem_logs_init:
        condition: service_completed_successfully

  hsp_zeek:
    mem_limit: 768m
    cpus: "1.0"
    image: zeek/zeek@sha256:eca2b3915d3e067cbb4a904f23f4c4f461ea2b60613ab30f7ee77bbc707c87c7
    container_name: hsp_zeek
    network_mode: "service:hospital_ot"
    cap_add: ["NET_ADMIN", "NET_RAW"]
    volumes:
      - ./infra/zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
      - type: volume
        source: siem_logs
        target: /var/log/siem/hospital_ot
        volume:
          subpath: hospital_ot
    working_dir: /var/log/siem/hospital_ot
    entrypoint: ["sh", "-c", "mkdir -p /var/log/siem/hospital_ot && cd /var/log/siem/hospital_ot && zeek -i eth0 local"]
    depends_on:
      hospital_ot:
        condition: service_started
      siem_logs_init:
        condition: service_completed_successfully

networks:
  # 트윈 격리 네트워크(로드맵 F ★★★): internal:true 로 인터넷 egress 차단.
  # 각 트윈은 자기 네트워크에만 있고 코어 서비스(event_collector/config_service/edr_backend)만
  # 함께 붙어 있어, 트윈→코어 통신은 되지만 트윈끼리(lateral)·외부(egress)는 도달 불가.
  twin_ground_station: { driver: bridge, internal: true }
  twin_power_plant: { driver: bridge, internal: true }
  twin_defense_network: { driver: bridge, internal: true }
  twin_refinery_plant: { driver: bridge, internal: true }
  twin_smart_factory: { driver: bridge, internal: true }
  twin_water_utility: { driver: bridge, internal: true }
  twin_lng_terminal: { driver: bridge, internal: true }
  twin_railway_signaling: { driver: bridge, internal: true }
  twin_airport_ot: { driver: bridge, internal: true }
  twin_datacenter_bms: { driver: bridge, internal: true }
  twin_hospital_ot: { driver: bridge, internal: true }
  range_control: { driver: bridge }
  # Logical A/D planes. Docker Compose cannot enforce directional egress;
  # production NetworkPolicy examples live under infra/attack_defense/.
  # internal:true → 팀 컨테이너의 인터넷 egress 차단(감사 2.3). 호스트→팀은 published 포트로
  # 여전히 도달하고, 체커(attack_defense)도 이 망에 붙어 컨테이너명으로 팀 서비스에 접근한다.
  ad_team_access: { driver: bridge, internal: true }
  ad_game_attack: { driver: bridge, internal: true }
  ad_scoreboard_api: { driver: bridge }
  ad_management: { driver: bridge, internal: true }
  # Host-side push/pull path. Game service containers are deliberately absent.
  ad_registry_host: { driver: bridge }

