# Cyber Range 통합 개발용 오케스트레이션 (17번 문서 구조 / 단일 모노레포)
# ---------------------------------------------------------------------------
# 이전에는 cyber-range / cyber-range-contracts 두 리포를 형제 디렉토리로 두고
# context: ../cyber-range-contracts 로 참조했지만, 이제 하나의 리포로 합쳐졌으므로
# 모든 build context 는 리포 루트(.) 하나로 단순화된다.
#
# 각 디지털 트윈은 독립 네트워크(twin_*)로 격리하고, 코어 서비스와는
# range_control 네트워크로만 통신한다(이벤트/점수/패치/텔레메트리 전용 경로).
version: "3.8"

x-ad-service-security: &ad-service-security
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  mem_limit: 256m
  cpus: 0.50
  restart: unless-stopped

services:
  event_collector:
    build: { context: ., dockerfile: services/event_collector/Dockerfile }
    container_name: event_collector
    volumes:
      - ec_data:/data
    environment:
      - DATA_DIR=/data
    ports: ["8010:8010"]
    # 격리된 트윈들이 이벤트를 보낼 수 있도록 각 twin_* internal 네트워크에도 연결.
    networks: [range_control, twin_ground_station, twin_power_plant, twin_defense_network, twin_refinery_plant, twin_smart_factory, twin_water_utility, twin_lng_terminal, twin_railway_signaling, twin_airport_ot, twin_datacenter_bms, twin_hospital_ot]

  scoring_engine:
    build: { context: ., dockerfile: services/scoring_engine/Dockerfile }
    container_name: scoring_engine
    volumes:
      - sc_data:/data
    ports: ["8020:8020"]
    environment:
      # /score/adjust(수동 점수조정) RBAC용. 토큰 미설정 시 dev 모드로 열리므로 반드시 주입.
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-dev-instructor-token}
      - RED_TOKEN=${RED_TOKEN:-}
      - BLUE_TOKEN=${BLUE_TOKEN:-}
      - OBSERVER_TOKEN=${OBSERVER_TOKEN:-}
      # 관전자 read 게이트(기본 off = 공개). true 시 /scores 등 read에 유효 토큰 요구.
      - OBSERVER_READ_ENFORCE=${OBSERVER_READ_ENFORCE:-}
      - DATA_DIR=/data
    networks: [range_control]

  config_service:
    build: { context: ., dockerfile: services/config_service/Dockerfile }
    container_name: config_service
    volumes:
      - cf_data:/data
    ports: ["8030:8030"]
    environment:
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-dev-instructor-token}
      - RED_TOKEN=${RED_TOKEN:-}
      - BLUE_TOKEN=${BLUE_TOKEN:-}
      - OBSERVER_TOKEN=${OBSERVER_TOKEN:-}
      - DATA_DIR=/data
    # 격리된 트윈들이 패치 상태를 폴링할 수 있도록 각 twin_* 네트워크에도 연결.
    networks: [range_control, twin_ground_station, twin_power_plant, twin_defense_network, twin_refinery_plant, twin_smart_factory, twin_water_utility, twin_lng_terminal, twin_railway_signaling, twin_airport_ot, twin_datacenter_bms, twin_hospital_ot]

  edr_backend:
    build: { context: ., dockerfile: services/edr/Dockerfile }
    container_name: edr_backend
    volumes:
      - edr_data:/data
    ports: ["8080:8080"]
    environment:
      - CONFIG_SERVICE_URL=http://config_service:8030
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-dev-instructor-token}
      - RED_TOKEN=${RED_TOKEN:-}
      - BLUE_TOKEN=${BLUE_TOKEN:-}
      - OBSERVER_TOKEN=${OBSERVER_TOKEN:-}
      # 관전자 read 게이트(기본 off = 공개). true 시 /edr/hosts 등 read에 유효 토큰 요구.
      - OBSERVER_READ_ENFORCE=${OBSERVER_READ_ENFORCE:-}
      - DATA_DIR=/data
    depends_on: [config_service]
    # 격리된 트윈의 EDR 에이전트가 텔레메트리를 보낼 수 있도록 각 twin_* 네트워크에도 연결.
    networks: [range_control, twin_ground_station, twin_power_plant, twin_defense_network, twin_refinery_plant, twin_smart_factory, twin_water_utility, twin_lng_terminal, twin_railway_signaling, twin_airport_ot, twin_datacenter_bms, twin_hospital_ot]

  siem_api:
    build: { context: ., dockerfile: services/siem/Dockerfile }
    container_name: siem_api
    ports:
      - "8040:8040"
      - "1514:1514/udp"   # syslog 수신(26번 문서 5절)
    environment:
      - SIEM_LOG_DIR=/var/log/siem
      - SYSLOG_UDP_PORT=1514
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - PUSH_TO_LIVEFIRE=true
      - INCIDENT_URL=http://incident:8095
      - INCIDENT_AUTO_PROMOTE=true
      - INCIDENT_MIN_SEVERITY=5
      - SIEM_NOISE_ENABLED=false
      - SIEM_NOISE_EPS=2.0
      - DATA_DIR=/data
      - SIEM_DB_PATH=/data/siem.db
      - SIEM_ALERT_DB_PATH=/data/siem_alerts.db
    volumes:
      - si_data:/data
      - siem_logs:/var/log/siem:ro
    depends_on: [event_collector]
    networks: [range_control]

  scenario_engine:
    build: { context: ., dockerfile: services/scenario_engine/Dockerfile }
    container_name: scenario_engine
    ports: ["8045:8045"]
    environment:
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - EVENT_COLLECTOR_WS_URL=ws://event_collector:8010/ws
      - CONFIG_SERVICE_URL=http://config_service:8030
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-dev-instructor-token}
    depends_on: [event_collector, config_service]
    networks: [range_control]

  instructor_api:
    build: { context: ., dockerfile: services/instructor_api/Dockerfile }
    container_name: instructor_api
    volumes:
      - in_data:/data
    ports: ["8050:8050"]
    environment:
      - SCENARIO_ENGINE_URL=http://scenario_engine:8045
      - SCORING_ENGINE_URL=http://scoring_engine:8020
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-dev-instructor-token}
      - RED_TOKEN=${RED_TOKEN:-}
      - BLUE_TOKEN=${BLUE_TOKEN:-}
      - OBSERVER_TOKEN=${OBSERVER_TOKEN:-}
      - DATA_DIR=/data
    depends_on: [scenario_engine, scoring_engine, event_collector]
    networks: [range_control]

  aar_report:
    build: { context: ., dockerfile: services/aar_report/Dockerfile }
    container_name: aar_report
    ports: ["8090:8090"]
    environment:
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - SCORING_ENGINE_URL=http://scoring_engine:8020
      - SIEM_API_URL=http://siem_api:8040
      - INCIDENT_URL=http://incident:8095
      - INJECTS_URL=http://injects:8096
      - CHALLENGE_PORTAL_URL=http://challenge_portal:8060
    depends_on: [event_collector, scoring_engine]
    networks: [range_control]

  # NOC 모니터: 트윈 /health 폴링 + Recovery Watcher(04번 2절).
  # asset_compromised 이력 + 취약점 patched + 3회 연속 정상 -> asset_recovered(+50) 발행.
  # 트윈 상태를 폴링해야 하므로 각 twin_* 네트워크와 range_control 모두에 연결.
  match_proxy:
    image: nginx:alpine
    container_name: match_proxy
    ports: ["8088:8088"]
    volumes: [ ./infra/match/match_proxy.conf:/etc/nginx/conf.d/default.conf:ro ]
    networks: [range_control]

  range_control:
    build: { context: ., dockerfile: services/range_control/Dockerfile }
    container_name: range_control
    volumes:
      - rc_data:/data
    ports: ["8055:8055"]
    environment:
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - SCORING_ENGINE_URL=http://scoring_engine:8020
      - CONFIG_SERVICE_URL=http://config_service:8030
      - SIEM_API_URL=http://siem_api:8040
      - CHALLENGE_PORTAL_URL=http://challenge_portal:8060
      - EDR_BACKEND_URL=http://edr_backend:8080
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-dev-instructor-token}
      - DATA_DIR=/data
    depends_on: [event_collector, scoring_engine, config_service, challenge_portal]
    networks: [range_control]

  auth:
    build: { context: ., dockerfile: services/auth/Dockerfile }
    container_name: auth
    ports: ["8051:8051"]
    environment:
      - DATA_DIR=/data
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-demo-jwt-secret-change-before-production-32bytes}
      - AUTH_ADMIN_PASSWORD=${AUTH_ADMIN_PASSWORD:-demo-operator-change-me}
    volumes: [ auth_data:/data ]
    networks: [range_control]

  incident:
    build: { context: ., dockerfile: services/incident/Dockerfile }
    container_name: incident
    ports: ["8095:8095"]
    environment:
      - DATA_DIR=/data
      - EVENT_COLLECTOR_URL=http://event_collector:8010
    volumes: [ inc_case_data:/data ]
    depends_on: [event_collector]
    networks: [range_control]

  injects:
    build: { context: ., dockerfile: services/injects/Dockerfile }
    container_name: injects
    ports: ["8096:8096"]
    environment:
      - DATA_DIR=/data
      - EVENT_COLLECTOR_URL=http://event_collector:8010
    volumes: [ injects_data:/data ]
    depends_on: [event_collector]
    networks: [range_control]

  observability:
    build: { context: ., dockerfile: services/observability/Dockerfile }
    container_name: observability
    ports: ["8097:8097"]
    networks: [range_control, ad_scoreboard_api]

  # DEF CON-style symmetric Attack/Defense mode. This is an additive service;
  # legacy exercise services and their databases remain unchanged.
  attack_defense:
    build: { context: ., dockerfile: services/attack_defense/Dockerfile }
    container_name: attack_defense
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    ports: ["8100:8100"]
    volumes:
      - ad_data:/data
    environment:
      - ATTACK_DEFENSE_ENABLED=${ATTACK_DEFENSE_ENABLED:-true}
      - ATTACK_DEFENSE_DATA_DIR=/data
      - ATTACK_DEFENSE_FLAG_SECRET=${ATTACK_DEFENSE_FLAG_SECRET:-attack-defense-dev-flag-secret-change-me}
      - ATTACK_DEFENSE_FLAG_HASH_SECRET=${ATTACK_DEFENSE_FLAG_HASH_SECRET:-attack-defense-dev-hash-secret-change-me}
      - ATTACK_DEFENSE_MANAGEMENT_TOKEN=${ATTACK_DEFENSE_MANAGEMENT_TOKEN:-attack-defense-dev-management-token}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:-demo-jwt-secret-change-before-production-32bytes}
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-dev-instructor-token}
      - OPERATOR_TOKEN=${OPERATOR_TOKEN:-}
      - ROUND_DURATION_SECONDS=${ROUND_DURATION_SECONDS:-120}
      - ACTIVE_FLAG_WINDOW_ROUNDS=${ACTIVE_FLAG_WINDOW_ROUNDS:-3}
      - CHECK_INTERVAL_SECONDS=${CHECK_INTERVAL_SECONDS:-30}
      - CHECK_TIMEOUT_SECONDS=${CHECK_TIMEOUT_SECONDS:-10}
      - CHECK_RETRY_COUNT=${CHECK_RETRY_COUNT:-2}
      - SCOREBOARD_DELAY_ROUNDS=${SCOREBOARD_DELAY_ROUNDS:-0}
      - ATTACK_SCORE_PER_FLAG=${ATTACK_SCORE_PER_FLAG:-10}
      - DEFENSE_SCORE_PER_FLAG=${DEFENSE_SCORE_PER_FLAG:-5}
      - AVAILABILITY_SCORE_PER_ROUND=${AVAILABILITY_SCORE_PER_ROUND:-5}
      - MAX_FLAG_SUBMISSIONS_PER_MINUTE=${MAX_FLAG_SUBMISSIONS_PER_MINUTE:-120}
      - MAX_PATCH_SUBMISSIONS_PER_HOUR=${MAX_PATCH_SUBMISSIONS_PER_HOUR:-10}
      - PATCH_VALIDATION_TIMEOUT_SECONDS=${PATCH_VALIDATION_TIMEOUT_SECONDS:-180}
      - PATCH_MAX_IMAGE_SIZE_MB=${PATCH_MAX_IMAGE_SIZE_MB:-1024}
      - PATCH_ALLOWED_REGISTRY=${PATCH_ALLOWED_REGISTRY:-registry.local:5000}
      - PATCH_RUNTIME_REGISTRY=${PATCH_RUNTIME_REGISTRY:-localhost:5000}
      - GAME_RUNTIME=${GAME_RUNTIME:-docker_compose}
    depends_on:
      - ad_team_01_notes
      - ad_team_01_vault
      - ad_team_02_notes
      - ad_team_02_vault
      - ad_team_03_notes
      - ad_team_03_vault
      - ad_registry
    networks: [range_control, ad_management, ad_scoreboard_api]

  ad_registry:
    image: registry:2
    container_name: ad_registry
    ports: ["127.0.0.1:5000:5000"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes: [ad_registry_data:/var/lib/registry]
    networks:
      ad_management:
        aliases: [registry.local]
      ad_registry_host: {}

  ad_team_01_notes:
    <<: *ad-service-security
    image: ${AD_IMAGE_AD_TEAM_01_NOTES:-cyber-range/ad-vulnerable-notes:base}
    build: { context: ., dockerfile: services/attack_defense/demo_services/vulnerable_notes/Dockerfile }
    ports: ["9101:9000"]
    environment: &ad-service-env
      ATTACK_DEFENSE_MANAGEMENT_TOKEN: ${ATTACK_DEFENSE_MANAGEMENT_TOKEN:-attack-defense-dev-management-token}
    volumes: [ad_team_01_notes_data:/data]
    networks: [ad_team_access, ad_game_attack, ad_management]

  ad_team_01_vault:
    <<: *ad-service-security
    image: ${AD_IMAGE_AD_TEAM_01_VAULT:-cyber-range/ad-file-vault:base}
    build: { context: ., dockerfile: services/attack_defense/demo_services/file_vault/Dockerfile }
    ports: ["9201:9000"]
    environment: *ad-service-env
    volumes: [ad_team_01_vault_data:/data]
    networks: [ad_team_access, ad_game_attack, ad_management]

  ad_team_02_notes:
    <<: *ad-service-security
    image: ${AD_IMAGE_AD_TEAM_02_NOTES:-cyber-range/ad-vulnerable-notes:base}
    build: { context: ., dockerfile: services/attack_defense/demo_services/vulnerable_notes/Dockerfile }
    ports: ["9102:9000"]
    environment: *ad-service-env
    volumes: [ad_team_02_notes_data:/data]
    networks: [ad_team_access, ad_game_attack, ad_management]

  ad_team_02_vault:
    <<: *ad-service-security
    image: ${AD_IMAGE_AD_TEAM_02_VAULT:-cyber-range/ad-file-vault:base}
    build: { context: ., dockerfile: services/attack_defense/demo_services/file_vault/Dockerfile }
    ports: ["9202:9000"]
    environment: *ad-service-env
    volumes: [ad_team_02_vault_data:/data]
    networks: [ad_team_access, ad_game_attack, ad_management]

  ad_team_03_notes:
    <<: *ad-service-security
    image: ${AD_IMAGE_AD_TEAM_03_NOTES:-cyber-range/ad-vulnerable-notes:base}
    build: { context: ., dockerfile: services/attack_defense/demo_services/vulnerable_notes/Dockerfile }
    ports: ["9103:9000"]
    environment: *ad-service-env
    volumes: [ad_team_03_notes_data:/data]
    networks: [ad_team_access, ad_game_attack, ad_management]

  ad_team_03_vault:
    <<: *ad-service-security
    image: ${AD_IMAGE_AD_TEAM_03_VAULT:-cyber-range/ad-file-vault:base}
    build: { context: ., dockerfile: services/attack_defense/demo_services/file_vault/Dockerfile }
    ports: ["9203:9000"]
    environment: *ad-service-env
    volumes: [ad_team_03_vault_data:/data]
    networks: [ad_team_access, ad_game_attack, ad_management]

  # Fixed management-only sandbox. The trusted host runtime runner starts this
  # profile with a digest-pinned candidate image; no port is published.
  ad_patch_sandbox:
    <<: *ad-service-security
    profiles: ["patch-runner"]
    image: ${AD_IMAGE_AD_PATCH_SANDBOX:-cyber-range/ad-vulnerable-notes:base}
    environment: *ad-service-env
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /data:rw,noexec,nosuid,size=64m,uid=65532,gid=65532,mode=0700
    networks: [ad_management]

  # 클라우드 네이티브 공격면 트윈(IMDS SSRF·Docker API·kubelet·secrets·SSTI). ICS 아님.
  cloud_native:
    build: { context: ., dockerfile: services/cloud_native/Dockerfile }
    container_name: cloud_native
    ports: ["8209:8209"]
    environment:
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - CONFIG_SERVICE_URL=http://config_service:8030
      - SIEM_LOG_DIR=/var/log/siem
    volumes:
      - siem_logs:/var/log/siem
    depends_on: [event_collector, config_service]
    networks: [range_control]

  challenge_portal:
    build: { context: ., dockerfile: services/challenge_portal/Dockerfile }
    container_name: challenge_portal
    volumes:
      - cp_data:/data
    ports: ["8060:8060"]
    environment:
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - CONFIG_SERVICE_URL=http://config_service:8030
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:-dev-instructor-token}
      - DATA_DIR=/data
    depends_on: [event_collector, config_service]
    networks: [range_control]

  noc_monitor:
    build: { context: ., dockerfile: services/noc_monitor/Dockerfile }
    container_name: noc_monitor
    volumes:
      - noc_data:/data
    ports: ["8070:8070"]
    environment:
      - CONFIG_SERVICE_URL=http://config_service:8030
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - EVENT_COLLECTOR_WS_URL=ws://event_collector:8010/ws
      - DATA_DIR=/data
    depends_on: [event_collector, config_service, ground_station, power_plant, defense_network]
    networks: [range_control, twin_ground_station, twin_power_plant, twin_defense_network]

  # EDR 콘솔 / Live Fire 대시보드는 Node 개발서버로 별도 기동 권장(21번 M4/M6).

  # 트윈 인그레스 게이트웨이(로드맵 F ★★★): 격리된 트윈(internal 네트워크)에 호스트가
  # 접근할 수 있게 리버스 프록시. per-twin으로 분리해 각 게이트웨이가 자기 트윈 네트워크
  # 하나와만 연결 → 트윈이 게이트웨이를 경유해 형제 트윈에 도달하는 간접 lateral까지 차단.
  gs_gateway:
    image: nginx:alpine
    container_name: gs_gateway
    ports: ["8001:8001"]
    volumes: [./infra/twin_gateway/gs.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [ground_station]
    networks: [range_control, twin_ground_station]

  pp_gateway:
    image: nginx:alpine
    container_name: pp_gateway
    ports: ["8002:8002"]
    volumes: [./infra/twin_gateway/pp.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [power_plant]
    networks: [range_control, twin_power_plant]

  dn_gateway:
    image: nginx:alpine
    container_name: dn_gateway
    ports: ["8003:8003"]
    volumes: [./infra/twin_gateway/dn.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [defense_network]
    networks: [range_control, twin_defense_network]

  ground_station:
    build: { context: ., dockerfile: services/ground_station/Dockerfile }
    container_name: gs_twin
    # 호스트 포트 미노출 — twin_gateway를 통해서만 접근(격리 F ★★★).
    environment:
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - CONFIG_SERVICE_URL=http://config_service:8030
      - EDR_BACKEND_URL=http://edr_backend:8080
      - SIEM_LOG_DIR=/var/log/siem
    volumes:
      - siem_logs:/var/log/siem
    depends_on: [event_collector, config_service, edr_backend]
    # 격리(로드맵 F ★★★): range_control 미연결. 트윈은 자기 internal 네트워크에만 있어
    # 다른 트윈으로의 lateral 이동과 인터넷 egress가 모두 차단된다. 코어 서비스(event_collector/
    # config_service/edr_backend)가 이 twin_* 네트워크에 함께 붙어 트윈→코어 통신만 허용.
    networks: [twin_ground_station]

  power_plant:
    build: { context: ., dockerfile: services/power_plant/Dockerfile }
    container_name: pp_twin
    # 호스트 포트 미노출 — twin_gateway 경유(격리 F ★★★).
    environment:
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - CONFIG_SERVICE_URL=http://config_service:8030
      - EDR_BACKEND_URL=http://edr_backend:8080
      - SIEM_LOG_DIR=/var/log/siem
    volumes:
      - siem_logs:/var/log/siem
    depends_on: [event_collector, config_service, edr_backend]
    networks: [twin_power_plant]   # 격리: internal 네트워크에만 (F ★★★, ground_station 주석 참고)

  defense_network:
    build: { context: ., dockerfile: services/defense_network/Dockerfile }
    container_name: dn_twin
    # 호스트 포트 미노출 — twin_gateway 경유(격리 F ★★★).
    environment:
      - EVENT_COLLECTOR_URL=http://event_collector:8010
      - CONFIG_SERVICE_URL=http://config_service:8030
      - EDR_BACKEND_URL=http://edr_backend:8080
      - SIEM_LOG_DIR=/var/log/siem
    volumes:
