    user: "99:99"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    ports: ["127.0.0.1:8110:8110"]
    volumes:
      - ./infra/attack_defense/haproxy-ha.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      attack_defense_ha: {condition: service_healthy}
    restart: unless-stopped
    networks: [range_control, ad_scoreboard_api]

  ad_registry:
    mem_limit: 192m
    cpus: "0.50"
