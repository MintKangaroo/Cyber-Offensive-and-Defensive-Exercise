      SIEM_LOG_DIR: /var/log/siem/attack_defense
      SIEM_ASSET: attack_defense
    volumes:
      - ad_team_01_notes_data:/data
      - type: volume
        source: siem_logs
        target: /var/log/siem/attack_defense
        volume:
          subpath: attack_defense
