    container_name: gs_suricata
    network_mode: "service:ground_station"
    cap_add: ["NET_ADMIN", "NET_RAW"]
    volumes:
      - ./infra/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./infra/suricata/custom.rules:/etc/suricata/rules/custom.rules:ro
      - type: volume
