<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Control Tower — Cyber Range</title>
<style>
  :root{
    --bg:#0A0E1A; --panel:#0F1524; --panel2:#131B2E; --border:#1E2A3F;
    --ink:#E8EDF5; --dim:#6B7A99; --dim2:#8A98B8;
    --red:#FB7185; --blue:#22D3EE; --green:#34D399; --amber:#F5A623; --violet:#A78BFA;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  body{display:flex;flex-direction:column;overflow:hidden}
  a{color:inherit;text-decoration:none}
  .mono{font-family:var(--mono)}
  header{height:52px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--border);flex-shrink:0}
  header .title{font-family:var(--mono);letter-spacing:.22em;font-size:14px}
  header .badge{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--dim);border:1px solid var(--border);border-radius:4px;padding:2px 7px}
  .spacer{flex:1}
  .conn{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
  .dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}
  .grid{flex:1;display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto 1fr;gap:12px;padding:12px;min-height:0}
  .health{grid-column:1 / span 2;display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:6px 11px;font-family:var(--mono);font-size:12px}
  .chip .nm{color:var(--dim2)}
  .chip .lat{color:var(--dim);font-size:10px;margin-left:2px}
  .col{min-height:0;display:flex;flex-direction:column;gap:12px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;min-height:0}
  .panel > h2{margin:0;padding:10px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--dim);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .panel > h2 .count{margin-left:auto;color:var(--dim2);font-family:var(--mono);font-size:11px}
  .feed{flex:1;overflow-y:auto;padding:4px 0}
  .ev{display:grid;grid-template-columns:64px 96px 1fr;gap:10px;padding:5px 14px;font-family:var(--mono);font-size:12px;border-left:2px solid transparent}
  .ev:hover{background:var(--panel2)}
  .ev .t{color:var(--dim)}
  .ev .tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;align-self:center}
  .ev.events{border-left-color:var(--red)} .ev.events .tag{color:var(--red)}
  .ev.detections{border-left-color:var(--blue)} .ev.detections .tag{color:var(--blue)}
  .ev.scores{border-left-color:var(--green)} .ev.scores .tag{color:var(--green)}
  .ev.safety{border-left-color:var(--amber)} .ev.safety .tag{color:var(--amber)}
  .ev.phase_clock{border-left-color:var(--violet)} .ev.phase_clock .tag{color:var(--violet)}
  .ev .msg{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev .msg b{color:var(--dim2);font-weight:600}
  .rows{overflow-y:auto;padding:6px 0}
  .score{display:flex;align-items:center;gap:10px;padding:6px 14px;font-family:var(--mono);font-size:13px}
  .score .team{flex:1;color:var(--ink)}
  .score .rd{color:var(--red);width:58px;text-align:right}
  .score .bl{color:var(--blue);width:58px;text-align:right}
  .kv{display:flex;justify-content:space-between;padding:5px 14px;font-family:var(--mono);font-size:12px}
  .kv .k{color:var(--dim)} .kv .v{color:var(--ink)}
  .v.ok{color:var(--green)} .v.bad{color:var(--red)} .v.warn{color:var(--amber)}
  .controls{grid-column:1 / span 2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .controls .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--dim);margin-right:2px}
  input,select{background:var(--panel2);border:1px solid var(--border);color:var(--ink);border-radius:6px;padding:6px 9px;font-family:var(--mono);font-size:12px}
  input::placeholder{color:var(--dim)}
  button{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--ink);border-radius:6px;padding:7px 13px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  button:hover{border-color:var(--dim2)}
  button.go{border-color:var(--green);color:var(--green)} button.go:hover{background:rgba(52,211,153,.1)}
  button.stop{border-color:var(--red);color:var(--red)} button.stop:hover{background:rgba(251,113,133,.1)}
  button.warn{border-color:var(--amber);color:var(--amber)} button.warn:hover{background:rgba(245,166,35,.1)}
  .links{display:flex;gap:8px;margin-left:auto}
  .links a{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;border:1px solid var(--border);border-radius:6px;color:var(--dim2)}
  .links a:hover{border-color:var(--dim2);color:var(--ink)}
  #toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-family:var(--mono);font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:70vw}
  #toast.show{opacity:1}
  #toast.err{border-color:var(--red);color:var(--red)}
  #toast.ok{border-color:var(--green);color:var(--green)}
  .empty{color:var(--dim);font-family:var(--mono);font-size:12px;padding:14px}
  @media(max-width:900px){.grid{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}.col.right{order:3}}
</style>
</head>
<body>
<header>
  <span class="title">◎ CONTROL TOWER</span>
  <span class="badge">training environment</span>
  <span class="badge mono" id="mode">detecting…</span>
  <div class="spacer"></div>
  <div class="conn"><span class="dot" id="sseDot"></span><span id="sseTxt">SSE …</span></div>
  <span class="mono" id="clock" style="color:var(--dim);font-size:12px"></span>
</header>

<div class="grid">
  <!-- 서비스 헬스 -->
  <div class="health" id="health"></div>

  <!-- 라이브 이벤트 피드 -->
  <div class="col">
    <div class="panel" style="flex:1">
      <h2>◈ Live Situation Feed <span class="count" id="feedCount">0</span></h2>
      <div class="feed" id="feed"><div class="empty">SSE 구독 대기 중… 이벤트가 들어오면 여기에 실시간 표시됩니다.</div></div>
    </div>
  </div>

  <!-- 우측: 점수 · 매치 · 안전 -->
  <div class="col right">
    <div class="panel" style="flex:1.2">
      <h2>▲ Scoreboard <span class="count" id="scenTag">default</span></h2>
      <div class="rows" id="scores"><div class="empty">점수 없음</div></div>
    </div>
    <div class="panel">
      <h2>▦ Matches <span class="count" id="matchCount">0</span></h2>
      <div class="rows" id="matches"><div class="empty">매치 없음</div></div>
    </div>
    <div class="panel">
      <h2>⛨ Safety</h2>
      <div class="rows" id="safety"><div class="empty">…</div></div>
    </div>
  </div>

  <!-- 컨트롤 바 -->
  <div class="controls">
    <span class="lbl">Scenario</span>
    <input id="scId" placeholder="scenario_id" value="power_plant_ransomware" size="20"/>
    <input id="teams" placeholder="team_ids (a,b)" value="team_a,team_b" size="14"/>
    <button class="go" onclick="scenario('start')">▶ Start</button>
    <button onclick="scenario('end')">■ End</button>
    <span class="lbl" style="margin-left:10px">Safety</span>
    <button class="stop" onclick="estop(false)">⛔ Emergency Stop</button>
    <button class="warn" onclick="estop(true)">↺ Release</button>
    <button onclick="resetTraining()" style="margin-left:10px">⟲ Reset Training</button>
    <input id="token" placeholder="instructor token (dev/직접 접속 시)" size="24" style="margin-left:10px"/>
    <div class="links" id="links"></div>
  </div>
</div>
<div id="toast"></div>

<script>
// ── 서비스 맵: gateway 서브경로 + dev 직접 포트 ─────────────────────────────
const HOST = location.hostname || "localhost";
const SVC = {
  events:    {gw:"/api/events",     port:8010, health:"/health", label:"events"},
  scoring:   {gw:"/api/scoring",    port:8020, health:"/health", label:"scoring"},
  config:    {gw:"/api/config",     port:8030, health:"/health", label:"config"},
  siem:      {gw:"/api/siem",       port:8040, health:"/health", label:"siem"},
  auth:      {gw:"/auth",           port:8051, health:"/health", label:"auth"},
  instructor:{gw:"/api/instructor", port:8050, health:"/health", label:"instructor"},
  range:     {gw:"/api/range",      port:8055, health:"/health", label:"range"},
  portal:    {gw:"/api/portal",     port:8060, health:"/health", label:"portal"},
  edr:       {gw:"/api/edr",        port:8080, health:"/health", label:"edr"},
  noc:       {gw:null,              port:8070, health:"/health", label:"noc"},
  aar:       {gw:null,              port:8090, health:"/health", label:"aar"},
};
let MODE = "direct"; // "gateway" | "direct"
function base(svc){
  const s = SVC[svc];
  if (MODE === "gateway" && s.gw) return s.gw;
  return `${location.protocol}//${HOST}:${s.port}`;
}
function authHeaders(){
  const t = document.getElementById("token").value.trim();
  return t ? {Authorization:`Bearer ${t}`} : {};
}
const cred = () => (MODE === "gateway" ? "include" : "same-origin");

// ── 토스트 ──────────────────────────────────────────────────────────────────
let toastT;
function toast(msg, kind){
  const el = document.getElementById("toast");
  el.textContent = msg; el.className = "show " + (kind||"");
  clearTimeout(toastT); toastT = setTimeout(()=>el.className="", 3200);
}

// ── 모드 감지: gateway /api 프록시가 살아있으면 gateway, 아니면 dev 직접 ──────
async function detectMode(){
  try{
    const r = await fetch("/api/events/health", {credentials:"include"});
    if (r.ok){ MODE="gateway"; }
  }catch(_){}
  document.getElementById("mode").textContent = MODE === "gateway" ? "gateway /api" : `direct :ports@${HOST}`;
  buildLinks();
}
function buildLinks(){
  const L = document.getElementById("links");
  const items = MODE === "gateway"
    ? [["OPS","/ops/"],["RED","/red/"],["BLUE","/blue/"],["SIEM","/blue/siem/"],["EDR","/blue/edr/"]]
    : [["OPS",`http://${HOST}:5174/`],["RED",`http://${HOST}:5176/`],["BLUE",`http://${HOST}:5177/`],["SIEM",`http://${HOST}:5175/`],["EDR",`http://${HOST}:5173/`]];
  L.innerHTML = items.map(([n,u])=>`<a href="${u}" target="_blank" rel="noreferrer">${n}↗</a>`).join("");
}

// ── 서비스 헬스 폴링 ────────────────────────────────────────────────────────
function healthChips(){
  const box = document.getElementById("health");
  box.innerHTML = Object.keys(SVC).map(k=>{
    const skip = MODE==="gateway" && !SVC[k].gw;   // gateway 모드에서 미프록시 서비스는 표시만
    return `<div class="chip" id="h_${k}"><span class="dot ${skip?'':''}"></span><span class="nm">${SVC[k].label}</span><span class="lat" id="lat_${k}"></span></div>`;
  }).join("");
}
async function pollHealth(){
  await Promise.all(Object.keys(SVC).map(async k=>{
    const s = SVC[k];
    if (MODE==="gateway" && !s.gw){ setChip(k,null,"n/a"); return; }
    const t0 = performance.now();
    try{
      const r = await fetch(base(k)+s.health, {credentials:cred()});
      // 도달 가능(=서비스 살아있음)이면 up. 프록시 경로차로 404/401 이 와도 "응답함"이 핵심.
      const alive = r.status < 500;
      setChip(k, alive, alive ? Math.round(performance.now()-t0)+"ms" : "5xx");
    }catch(_){ setChip(k, false, "down"); }
  }));
}
function setChip(k, ok, lat){
  const chip = document.getElementById("h_"+k); if(!chip) return;
  const dot = chip.querySelector(".dot");
  dot.className = "dot " + (ok===null?"":(ok?"on":"off"));
  document.getElementById("lat_"+k).textContent = lat||"";
}

// ── 점수 · 매치 · 안전 폴링 ─────────────────────────────────────────────────
async function pollScores(){
  try{
    const r = await fetch(base("scoring")+"/scores?scenario_id=default", {credentials:cred()});
    const d = await r.json();
    const teams = d.teams || {};
    const box = document.getElementById("scores");
    const keys = Object.keys(teams).sort((a,b)=>((teams[b].red||0)+(teams[b].blue||0))-((teams[a].red||0)+(teams[a].blue||0)));
    box.innerHTML = keys.length ? keys.map(t=>`<div class="score"><span class="team">${t}</span><span class="rd">R ${teams[t].red||0}</span><span class="bl">B ${teams[t].blue||0}</span></div>`).join("") : `<div class="empty">점수 없음</div>`;
  }catch(_){}
}
async function pollMatches(){
  try{
    const r = await fetch(base("range")+"/matches", {credentials:cred()});
    const d = await r.json();
    const ms = d.matches || d || [];
    const arr = Array.isArray(ms) ? ms : Object.values(ms);
    document.getElementById("matchCount").textContent = arr.length;
    const box = document.getElementById("matches");
    box.innerHTML = arr.length ? arr.map(m=>`<div class="kv"><span class="k">${m.match_id||m.id||"?"}</span><span class="v">${m.scenario_id||m.status||""}</span></div>`).join("") : `<div class="empty">매치 없음</div>`;
  }catch(_){}
}
async function pollSafety(){
  try{
    const r = await fetch(base("range")+"/safety/status", {credentials:cred()});
    const s = (await r.json()).safety || {};
    const box = document.getElementById("safety");
    const row=(k,v,cls)=>`<div class="kv"><span class="k">${k}</span><span class="v ${cls||''}">${v}</span></div>`;
    box.innerHTML =
      row("containment", s.range_containment_score||"?", "ok") +
      row("internet egress", s.internet_egress||"?", s.internet_egress==="BLOCKED"?"ok":"bad") +
      row("cross-team", s.cross_team_traffic||"?", s.cross_team_traffic==="BLOCKED"?"ok":"bad") +
      row("emergency stop", s.active_emergency_stop?"ACTIVE":"off", s.active_emergency_stop?"warn":"ok") +
      row("paused teams", (s.paused_teams||[]).join(",")||"none");
  }catch(_){ document.getElementById("safety").innerHTML=`<div class="empty">range 서비스 응답 없음</div>`; }
}

// ── SSE 라이브 피드 (P0-4) ──────────────────────────────────────────────────
let es, feedN=0, backoff=1000;
function connectSSE(){
  const url = base("events")+"/stream?topics=events,detections,scores,safety,phase_clock";
  try{ es = new EventSource(url, {withCredentials: MODE==="gateway"}); }catch(_){ return schedule(); }
  es.onopen = ()=>{ setSSE(true); backoff=1000; };
  ["events","detections","scores","safety","phase_clock"].forEach(topic=>{
    es.addEventListener(topic, e=>{ try{ addEvent(topic, JSON.parse(e.data)); }catch(_){} });
  });
  es.onerror = ()=>{ setSSE(false); if(es && es.readyState===2){ es.close(); schedule(); } };
}
function schedule(){ setTimeout(connectSSE, backoff); backoff=Math.min(backoff*2,15000); }
function setSSE(on){
  document.getElementById("sseDot").className = "dot " + (on?"on":"off");
  document.getElementById("sseTxt").textContent = on ? "SSE live" : "SSE reconnecting…";
}
function addEvent(topic, d){
  const feed = document.getElementById("feed");
  if (feedN===0) feed.innerHTML="";
  const time = new Date((d.timestamp?d.timestamp*1000:Date.now())).toLocaleTimeString("en-GB");
  let msg;
  if (topic==="scores") msg = `<b>${d.team_id||""}</b> ${d.actor||""} +${d.points||0} <span style="color:var(--dim)">${d.category||""}</span>`;
  else if (topic==="phase_clock") msg = `<b>${d.phase||"phase"}</b> ${d.remaining_sec!=null?d.remaining_sec+"s":""}`;
  else if (topic==="safety") msg = `<b>${d.interlock||d.event||"safety"}</b> ${JSON.stringify(d).slice(0,80)}`;
  else msg = `<b>${d.event_type||"?"}</b> ${d.actor||""} → ${d.target_asset||""} ${d.team_id?"["+d.team_id+"]":""}`;
  const row = document.createElement("div");
  row.className = "ev "+topic;
  row.innerHTML = `<span class="t">${time}</span><span class="tag">${topic}</span><span class="msg">${msg}</span>`;
  feed.insertBefore(row, feed.firstChild);
  while (feed.children.length>200) feed.removeChild(feed.lastChild);
  document.getElementById("feedCount").textContent = ++feedN;
}

// ── 컨트롤 액션 ─────────────────────────────────────────────────────────────
async function post(svc, path, body){
  const r = await fetch(base(svc)+path, {
    method:"POST", credentials:cred(),
    headers:{"Content-Type":"application/json", ...authHeaders()},
    body: JSON.stringify(body||{}),
  });
  const txt = await r.text();
  if (!r.ok) throw new Error(`${r.status}: ${txt.slice(0,160)}`);
  return txt;
}
async function scenario(action){
  const scId = document.getElementById("scId").value.trim();
  const reason = prompt(`시나리오 ${action} 사유(감사 로그에 기록):`);
  if (reason===null) return;
  const teams = document.getElementById("teams").value.split(",").map(s=>s.trim()).filter(Boolean);
  try{
    await post("instructor", `/instructor/scenario/${action}`,
      action==="start" ? {scenario_id:scId, team_ids:teams, reason} : {scenario_id:scId, reason});
    toast(`시나리오 ${action} ✓ (${scId})`, "ok"); pollScores(); pollMatches();
  }catch(e){ toast("실패 "+e.message, "err"); }
}
async function estop(release){
  const reason = prompt(`긴급정지 ${release?"해제":"발동"} 사유:`);
  if (reason===null) return;
  try{
    await post("range", `/safety/emergency-stop${release?"/release":""}`, {reason});
    toast(`긴급정지 ${release?"해제":"발동"} ✓`, release?"ok":"err"); pollSafety();
  }catch(e){ toast("실패 "+e.message, "err"); }
}
async function resetTraining(){
  if (!confirm("훈련 상태를 초기화합니다(이벤트·점수·패치·풀이). 계속?")) return;
  const targets = [["events","/admin/reset"],["scoring","/admin/reset"],["config","/admin/reset"],["portal","/admin/reset"]];
  let ok=0, fail=0;
  for (const [svc,path] of targets){
    try{ await post(svc, path, {}); ok++; }catch(_){ fail++; }
  }
  toast(`초기화 완료: ${ok} 성공${fail?", "+fail+" 실패":""}`, fail?"err":"ok");
  pollScores(); pollMatches(); feedN=0; document.getElementById("feed").innerHTML=`<div class="empty">초기화됨 — 새 이벤트 대기.</div>`;
}

// ── 부팅 ────────────────────────────────────────────────────────────────────
function tickClock(){ document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-GB"); }
(async function(){
  await detectMode();
  healthChips();
  connectSSE();
  const all = ()=>{ pollHealth(); pollScores(); pollMatches(); pollSafety(); };
  all();
  setInterval(pollHealth, 5000);
  setInterval(pollScores, 8000);   // SSE scores 가 즉시 갱신, 이건 fallback
  setInterval(pollMatches, 10000);
  setInterval(pollSafety, 6000);
  setInterval(tickClock, 1000); tickClock();
})();
</script>
</body>
</html>
