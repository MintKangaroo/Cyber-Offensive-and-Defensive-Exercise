<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>START HERE — Cyber Range Training</title>
<style>
  :root{
    --bg:#0A0E1A; --panel:#0F1524; --panel2:#131B2E; --border:#1E2A3F;
    --ink:#E8EDF5; --dim:#6B7A99; --dim2:#8A98B8;
    --red:#FB7185; --blue:#22D3EE; --green:#34D399; --amber:#F5A623; --violet:#A78BFA;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  a{color:inherit;text-decoration:none}
  .mono{font-family:var(--mono)}
  header{height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--border)}
  header .brand{font-family:var(--mono);letter-spacing:.22em;font-size:14px;color:var(--violet)}
  header .sub{font-size:11px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
  .spacer{flex:1}
  .who{font-family:var(--mono);font-size:12px;color:var(--dim2)}
  button{font-family:inherit;cursor:pointer}
  .ghost{background:transparent;border:1px solid var(--border);color:var(--dim2);border-radius:6px;padding:6px 12px;font-size:12px}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 60px}
  /* login */
  .login{max-width:420px;margin:8vh auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px}
  .login h1{margin:6px 0 4px;font-size:22px}
  .login p{color:var(--dim);font-size:13px;margin:0 0 20px;line-height:1.6}
  .field{display:block;margin-bottom:14px;font-size:12px;color:var(--dim2)}
  .field input{width:100%;margin-top:6px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--ink);font-family:var(--mono);font-size:13px}
  .primary{width:100%;background:linear-gradient(135deg,#7C3AED,#22D3EE);border:none;color:#06121f;border-radius:9px;padding:12px;font-weight:700;font-size:14px}
  .err{color:var(--red);font-size:12px;margin-top:12px;font-family:var(--mono)}
  /* stepper */
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
  h2.title{margin:2px 0 22px;font-size:26px}
  .stepper{display:flex;align-items:stretch;gap:0;margin:0 0 26px}
  .step{flex:1;display:flex;flex-direction:column;gap:6px;padding:16px;border:1px solid var(--border);background:var(--panel);position:relative}
  .step:first-child{border-radius:12px 0 0 12px}
  .step:last-child{border-radius:0 12px 12px 0}
  .step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;border:1px solid var(--border);color:var(--dim)}
  .step .lbl{font-weight:600;font-size:15px}
  .step .st{font-size:11px;color:var(--dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em}
  .step.done{border-color:var(--green)}
  .step.done .n{border-color:var(--green);background:var(--green);color:#06121f}
  .step.done .st{color:var(--green)}
  .step.active{border-color:var(--violet);box-shadow:inset 0 0 0 1px var(--violet)}
  .step.active .n{border-color:var(--violet);color:var(--violet)}
  .step.active .st{color:var(--violet)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px 24px;margin-bottom:16px}
  .card .mission-kicker{color:var(--amber);font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
  .card h3{margin:8px 0 6px;font-size:20px}
  .card p.why{color:var(--dim2);font-size:13px;line-height:1.7;margin:0 0 18px}
  .cta{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#7C3AED,#22D3EE);color:#06121f;border:none;border-radius:10px;padding:13px 22px;font-weight:700;font-size:15px}
  .cta.red{background:linear-gradient(135deg,#F43F5E,#FB7185)}
  .cta.blue{background:linear-gradient(135deg,#0891B2,#22D3EE)}
  .cta.dim{background:transparent;border:1px solid var(--border);color:var(--dim2);font-weight:600}
  .rowbtns{display:flex;flex-wrap:wrap;gap:10px}
  .hint{font-size:11px;color:var(--dim);margin-top:12px;font-family:var(--mono)}
  .scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 18px}
  .scoregrid .s{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}
  .scoregrid .s .v{font-family:var(--mono);font-size:30px;font-weight:700}
  .scoregrid .s .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.14em;margin-top:4px}
  .checkline{display:flex;align-items:center;gap:10px;font-size:14px;padding:6px 0;color:var(--dim2)}
  .checkline .mk{color:var(--dim)}
  .checkline.ok{color:var(--ink)}
  .checkline.ok .mk{color:var(--green)}
  .note{font-size:12px;color:var(--dim);line-height:1.7;margin-top:20px;border-top:1px solid var(--border);padding-top:16px}
  .adv{margin-top:26px}
  .adv summary{cursor:pointer;color:var(--dim);font-size:12px;font-family:var(--mono);letter-spacing:.08em}
  .adv .links{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .adv .links a{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--dim2);font-family:var(--mono)}
  .badge{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--border);border-radius:4px;padding:2px 7px;text-transform:uppercase;letter-spacing:.12em}
  .conn{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
  .dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";
  var HOST = location.hostname || "localhost";
  // 감사 U-9/E4: 게이트웨이(prod, /start/ 경로) 뒤에서는 dev 포트가 노출되지 않으므로
  // same-origin 게이트웨이 경로를 쓴다. dev(포트 5179 직접 서빙)에서는 기존 포트 방식.
  var GW = location.pathname.indexOf("/start") === 0;
  var AUTH_API, AD_API, RED_PORTAL, DEFENSE_PORTAL, CONTROL_TOWER, LEGACY_BLUE;
  if (GW) {
    AUTH_API = "";                  // 로그인은 게이트웨이 /auth/login
    AD_API = "/api/ad";             // 게이트웨이 /api/ad/ -> attack_defense:8100
    RED_PORTAL = "/red/";
    DEFENSE_PORTAL = "/ops/?mode=attack_defense";
    CONTROL_TOWER = "/control/";
    LEGACY_BLUE = "/blue/";
  } else {
    AUTH_API = "http://" + HOST + ":8051";
    AD_API = "http://" + HOST + ":8100";
    RED_PORTAL = "http://" + HOST + ":5176";
    DEFENSE_PORTAL = "http://" + HOST + ":5178/?mode=attack_defense";
    CONTROL_TOWER = "http://" + HOST + ":5180";
    LEGACY_BLUE = "http://" + HOST + ":5177";
  }
  var SESSION_KEY = "starthere_session";

  var el = document.getElementById("app");
  var state = { session: loadSession(), score: null, connected: false, view: "flow" };

  function loadSession(){
    try { var v = localStorage.getItem(SESSION_KEY); return v ? JSON.parse(v) : null; }
    catch(e){ return null; }
  }
  function saveSession(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
  function clearSession(){ localStorage.removeItem(SESSION_KEY); }

  function h(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs){
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.slice(0,2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function(c){
      if (c == null) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }

  async function login(username, password){
    var r = await fetch(AUTH_API + "/auth/login", {
      method: "POST", credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: username, password: password })
    });
    if (!r.ok) throw new Error("로그인 정보를 확인하세요. (아이디/비밀번호)");
    var s = await r.json();
    if (!s.team_id || !s.match_id) throw new Error("A/D 경기 참가자 계정이 아닙니다.");
    return s;
  }

  async function fetchScore(){
    if (!state.session) return;
    try {
      var r = await fetch(AD_API + "/api/attack-defense/matches/"
        + encodeURIComponent(state.session.match_id) + "/scoreboard");
      if (!r.ok) throw new Error("scoreboard " + r.status);
      var data = await r.json();
      var rows = data.scoreboard || [];
      state.score = rows.filter(function(row){ return row.team_id === state.session.team_id; })[0] || null;
      state.connected = true;
    } catch(e){
      state.connected = false;
    }
    render();
  }

  // Progress derivation: a phase is complete once its score is above zero.
  function progress(){
    var s = state.score || {};
    var attack = s.attack || 0, defense = s.defense || 0, availability = s.availability || 0;
    var attackDone = attack > 0;
    var defenseDone = defense > 0;
    return { attack: attack, defense: defense, availability: availability,
             total: s.total || 0, attackDone: attackDone, defenseDone: defenseDone };
  }

  function currentPhase(){
    var p = progress();
    if (!p.attackDone) return "attack";
    if (!p.defenseDone) return "defense";
    return "results";
  }

  function render(){
    el.innerHTML = "";
    if (!state.session){ el.appendChild(renderLogin()); return; }
    el.appendChild(renderHeader());
    var wrap = h("div", { class: "wrap" });
    if (state.view === "results") wrap.appendChild(renderResults());
    else wrap.appendChild(renderFlow());
    el.appendChild(wrap);
  }

  function renderHeader(){
    return h("header", {}, [
      h("span", { class: "brand" }, ["CYBER RANGE"]),
      h("span", { class: "sub" }, ["Training · Start Here"]),
      h("div", { class: "spacer" }),
      h("span", { class: "conn" }, [
        h("span", { class: "dot " + (state.connected ? "on" : "off") }),
        state.connected ? "LIVE" : "연결 대기"
      ]),
      h("span", { class: "who" }, [teamLabel()]),
      h("button", { class: "ghost", onclick: function(){ clearSession(); state.session = null; state.score = null; render(); } }, ["LOGOUT"])
    ]);
  }

  function teamLabel(){
    var t = (state.session.team_id || "").replace("team-", "Team ");
    return t || state.session.team_id || "";
  }

  function renderLogin(){
    var box = h("div", { class: "login" });
    var uname = h("input", { value: "team01", "aria-label": "Username", autocomplete: "username" });
    var pass = h("input", { type: "password", value: "demo-team-01-change-me", "aria-label": "Password", autocomplete: "current-password" });
    var err = h("div", { class: "err" });
    var btn = h("button", { class: "primary" }, ["훈련 시작 · START"]);
    var form = h("form", { onsubmit: async function(ev){
      ev.preventDefault(); err.textContent = ""; btn.disabled = true; btn.textContent = "연결 중…";
      try {
        var s = await login(uname.value.trim(), pass.value);
        saveSession(s); state.session = s; state.view = "flow";
        await fetchScore(); render();
      } catch(e){ err.textContent = String(e.message || e); btn.disabled = false; btn.textContent = "훈련 시작 · START"; }
    }}, [
      h("label", { class: "field" }, ["아이디 (Username)", uname]),
      h("label", { class: "field" }, ["비밀번호 (Password)", pass]),
      btn, err
    ]);
    box.appendChild(h("div", { class: "kicker" }, ["CYBER RANGE TRAINING"]));
    box.appendChild(h("h1", {}, ["환영합니다 👋"]));
    box.appendChild(h("p", {}, ["이 화면 하나에서 공격 → 방어 → 결과 순서로 훈련을 진행합니다. 포트 번호나 내부 구조는 몰라도 됩니다. 기본 계정으로 바로 시작하세요."]));
    box.appendChild(form);
    return box;
  }

  function stepper(){
    var phase = currentPhase();
    var p = progress();
    function step(n, key, label){
      var cls = "step";
      var st = "대기";
      if (key === "attack"){ if (p.attackDone){ cls += " done"; st = "완료"; } else if (phase === "attack"){ cls += " active"; st = "진행 중"; } }
      if (key === "defense"){ if (p.defenseDone){ cls += " done"; st = "완료"; } else if (phase === "defense"){ cls += " active"; st = "진행 중"; } }
      if (key === "results"){ if (phase === "results"){ cls += " active done"; st = "확인"; } }
      return h("div", { class: cls }, [
        h("div", { class: "n" }, [ (cls.indexOf("done") >= 0 && key !== "results") ? "✓" : String(n) ]),
        h("div", { class: "lbl" }, [label]),
        h("div", { class: "st" }, [st])
      ]);
    }
    return h("div", { class: "stepper" }, [
      step(1, "attack", "공격 Attack"),
      step(2, "defense", "방어 Defense"),
      step(3, "results", "결과 Results")
    ]);
  }

  function renderFlow(){
    var frag = document.createDocumentFragment();
    frag.appendChild(h("div", { class: "kicker" }, ["WELCOME · " + teamLabel().toUpperCase()]));
    frag.appendChild(h("h2", { class: "title" }, ["사이버 레인지 훈련"]));
    frag.appendChild(stepper());
    frag.appendChild(missionCard());
    frag.appendChild(advanced());
    return frag;
  }

  function missionCard(){
    var phase = currentPhase();
    var p = progress();
    var card = h("div", { class: "card" });
    if (phase === "attack"){
      card.appendChild(h("div", { class: "mission-kicker" }, ["MISSION · 지금 할 일"]));
      card.appendChild(h("h3", {}, ["상대 팀 서비스에서 플래그를 훔치세요"]));
      card.appendChild(h("p", { class: "why" }, ["왜? 실제 공격 팀처럼 상대 Notes/Vault 서비스의 취약점을 이용해 숨겨진 FLAG를 획득합니다. 아래 버튼을 누르면 초보자용 가이드 공격 화면이 열립니다. 단계별 안내(계정 생성 → 로그인 → 탐색 → 플래그)를 그대로 따라가면 됩니다."]));
      card.appendChild(h("div", { class: "rowbtns" }, [
        h("a", { href: RED_PORTAL, target: "_blank", rel: "noreferrer" }, [ h("button", { class: "cta red" }, ["① 공격 시작하기 ↗"]) ])
      ]));
      card.appendChild(h("div", { class: "hint" }, ["공격 화면은 새 탭에서 열립니다. FLAG를 제출하면 이 화면의 진행 상태가 자동으로 ‘완료’로 바뀝니다."]));
    } else if (phase === "defense"){
      card.appendChild(h("div", { class: "mission-kicker" }, ["MISSION · 지금 할 일"]));
      card.appendChild(h("h3", {}, ["내 서비스의 취약점을 방어하세요"]));
      card.appendChild(h("p", { class: "why" }, ["왜? 공격이 끝났으니 이제 방어자입니다. 내 Notes 서비스에는 방금 공격에 사용된 것과 같은 취약점이 있습니다. 초보자용 방어는 명령 하나 또는 방어 화면의 [Run Validation] 버튼으로 패치 빌드·배포·검증이 자동으로 처리됩니다."]));
      card.appendChild(h("div", { class: "rowbtns" }, [
        h("a", { href: DEFENSE_PORTAL, target: "_blank", rel: "noreferrer" }, [ h("button", { class: "cta blue" }, ["② 방어 화면 열기 ↗"]) ])
      ]));
      card.appendChild(h("div", { class: "hint" }, ["방어 화면의 ‘Defense Guide’ 탭을 여세요. 터미널을 쓰고 싶다면:  make beginner-defense  (또는  ./training defense )"]));
      card.appendChild(h("div", { class: "checkline " + (p.attackDone ? "ok" : "") }, [ h("span", { class: "mk" }, [ p.attackDone ? "✓" : "○" ]), "공격 단계 완료 (Attack " + p.attack + ")" ]));
    } else {
      card.appendChild(h("div", { class: "mission-kicker" }, ["ALL CLEAR"]));
      card.appendChild(h("h3", {}, ["훈련의 마지막 단계입니다 🎉"]));
      card.appendChild(h("p", { class: "why" }, ["공격과 방어를 모두 마쳤습니다. 결과 화면에서 점수를 확인하세요."]));
      card.appendChild(h("div", { class: "rowbtns" }, [
        h("button", { class: "cta", onclick: function(){ state.view = "results"; render(); } }, ["③ 결과 확인하기 →"])
      ]));
    }
    return card;
  }

  function renderResults(){
    var frag = document.createDocumentFragment();
    var p = progress();
    frag.appendChild(h("div", { class: "kicker" }, ["RESULTS · " + teamLabel().toUpperCase()]));
    frag.appendChild(h("h2", { class: "title" }, [ (p.attackDone && p.defenseDone) ? "훈련 완료 · Training Complete 🎉" : "현재 결과 · Progress" ]));

    var card = h("div", { class: "card" });
    card.appendChild(h("div", { class: "mission-kicker" }, ["SCORE"]));
    card.appendChild(h("div", { class: "scoregrid" }, [
      scoreTile(p.attack, "Attack", "red"),
      scoreTile(p.defense, "Defense", "blue"),
      scoreTile(p.availability, "Availability", "green")
    ]));
    card.appendChild(h("div", { class: "checkline " + (p.attackDone ? "ok" : "") }, [ h("span", { class: "mk" }, [ p.attackDone ? "✓" : "○" ]), "공격 — 플래그 획득 (Attack " + p.attack + ")" ]));
    card.appendChild(h("div", { class: "checkline " + (p.defenseDone ? "ok" : "") }, [ h("span", { class: "mk" }, [ p.defenseDone ? "✓" : "○" ]), "방어 — 취약점 패치 (Defense " + p.defense + ")" ]));
    card.appendChild(h("div", { class: "checkline " + (p.availability > 0 ? "ok" : "") }, [ h("span", { class: "mk" }, [ p.availability > 0 ? "✓" : "○" ]), "서비스 가용성 유지 (Availability " + p.availability + ")" ]));
    card.appendChild(h("div", { class: "rowbtns", style: "margin-top:20px" }, [
      h("button", { class: "cta dim", onclick: function(){ state.view = "flow"; render(); } }, ["↺ 훈련 다시 보기 (Restart Guide)"]),
      h("a", { href: CONTROL_TOWER, target: "_blank", rel: "noreferrer" }, [ h("button", { class: "cta dim" }, ["고급 모드 열기 (Open Advanced) ↗"]) ])
    ]));
    card.appendChild(h("div", { class: "note" }, ["점수는 경기 엔진의 라운드가 진행되며 갱신됩니다. 값이 0이면 아직 해당 단계를 완료하지 않았거나 다음 채점 라운드를 기다리는 중입니다."]));
    frag.appendChild(card);
    return frag;
  }

  function scoreTile(v, k){
    return h("div", { class: "s" }, [ h("div", { class: "v" }, [String(v)]), h("div", { class: "k" }, [k]) ]);
  }

  function advanced(){
    var d = h("details", { class: "adv" });
    d.appendChild(h("summary", {}, ["고급 사용자 / 교관용 화면 (Advanced)"]));
    d.appendChild(h("div", { class: "links" }, [
      h("a", { href: RED_PORTAL, target: "_blank", rel: "noreferrer" }, ["Red Portal · Attack (5176)"]),
      h("a", { href: DEFENSE_PORTAL, target: "_blank", rel: "noreferrer" }, ["Live Fire · Defense (5178)"]),
      h("a", { href: CONTROL_TOWER, target: "_blank", rel: "noreferrer" }, ["Control Tower (5180)"]),
      h("a", { href: LEGACY_BLUE, target: "_blank", rel: "noreferrer" }, ["Legacy Blue Portal (5177)"])
    ]));
    return d;
  }

  render();
  if (state.session) fetchScore();
  setInterval(function(){ if (state.session) fetchScore(); }, 5000);
  // Refresh immediately when the user returns to this tab after attacking/defending.
  document.addEventListener("visibilitychange", function(){ if (!document.hidden && state.session) fetchScore(); });
})();
</script>
</body>
</html>
