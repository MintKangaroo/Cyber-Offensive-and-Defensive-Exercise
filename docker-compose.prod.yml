# 프로덕션 프로파일 (P0-1) — 단일 진입점 gateway + 빌드 산출물 서빙 + prod 보안 기본값.
# 사용: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 접속: https://<host>/  (self-signed TLS 자동 생성). dev(현행 vite)는 이 파일 없이.
services:
  gateway:
    build: { context: ., dockerfile: infra/gateway/Dockerfile }
    container_name: gateway
    ports:
      - "8000:80"
      - "8443:443"
    environment:
      - GATEWAY_CN=${GATEWAY_CN:-cyber-range.local}
      # 프로덕션 fail-fast: 토큰 미설정이면 부팅 실패(gen_secrets.sh 실행 유도)
      - REQUIRE_TOKEN=${INSTRUCTOR_TOKEN:?prod requires INSTRUCTOR_TOKEN — run ./scripts/gen_secrets.sh}
    volumes:
      - gateway_certs:/certs
      # 실인증서 주입(선택): 호스트 ./certs 를 마운트하고 TLS_CERT_PATH/KEY_PATH 지정
    depends_on:
      - event_collector
      - scoring_engine
      - config_service
      - siem_api
      - edr_backend
      - instructor_api
      - challenge_portal
      - range_control
    networks: [range_control]

  # --- prod 보안 기본값: 관전자 read 게이트 ON (read도 인증 요구) ---
  scoring_engine:
    environment: [ "RANGE_SCOPE_ENFORCE=true",  "OBSERVER_READ_ENFORCE=true", "AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?prod requires AUTH_JWT_SECRET — run ./scripts/gen_secrets.sh}", "SERVICE_TOKEN=${SERVICE_TOKEN:?prod requires SERVICE_TOKEN}" ]
  edr_backend:
    environment: [ "SERVICE_TOKEN=${SERVICE_TOKEN:?prod requires SERVICE_TOKEN}", "RANGE_ASSET_SCOPES=${RANGE_ASSET_SCOPES:-}",  "RANGE_SCOPE_ENFORCE=true",  "OBSERVER_READ_ENFORCE=true", "AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?prod requires AUTH_JWT_SECRET — run ./scripts/gen_secrets.sh}" ]

  event_collector:
    environment: [ "RANGE_ASSET_SCOPES=${RANGE_ASSET_SCOPES:-}",  "RANGE_SCOPE_ENFORCE=true",  "AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?prod requires AUTH_JWT_SECRET}", "SERVICE_TOKEN=${SERVICE_TOKEN:?prod requires SERVICE_TOKEN — run ./scripts/gen_secrets.sh}" ]
  config_service:
    environment: [ "SERVICE_TOKEN=${SERVICE_TOKEN:?prod requires SERVICE_TOKEN}", "RANGE_ASSET_SCOPES=${RANGE_ASSET_SCOPES:-}",  "RANGE_SCOPE_ENFORCE=true",  "AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?prod requires AUTH_JWT_SECRET — run ./scripts/gen_secrets.sh}" ]
  instructor_api:
    environment: [ "RANGE_SCOPE_ENFORCE=true",  "AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?prod requires AUTH_JWT_SECRET — run ./scripts/gen_secrets.sh}" ]
  challenge_portal:
    environment: [ "RANGE_ASSET_SCOPES=${RANGE_ASSET_SCOPES:-}",  "RANGE_SCOPE_ENFORCE=true",  "AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?prod requires AUTH_JWT_SECRET — run ./scripts/gen_secrets.sh}" ]
  range_control:
    environment: [ "RANGE_SCOPE_ENFORCE=true",  "AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?prod requires AUTH_JWT_SECRET — run ./scripts/gen_secrets.sh}" ]
  siem_api:
    environment: [ "SERVICE_TOKEN=${SERVICE_TOKEN:?prod requires SERVICE_TOKEN}", "RANGE_ASSET_SCOPES=${RANGE_ASSET_SCOPES:-}",  "RANGE_SCOPE_ENFORCE=true",  "AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?prod requires AUTH_JWT_SECRET — run ./scripts/gen_secrets.sh}" ]
  auth:
    environment: [ "AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?prod requires AUTH_JWT_SECRET — run ./scripts/gen_secrets.sh}" ]
  incident:
    environment: [ "RANGE_SCOPE_ENFORCE=true",  "OBSERVER_READ_ENFORCE=true", "AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?prod requires AUTH_JWT_SECRET — run ./scripts/gen_secrets.sh}" ]
  injects:
    environment: [ "RANGE_SCOPE_ENFORCE=true",  "OBSERVER_READ_ENFORCE=true", "AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?prod requires AUTH_JWT_SECRET — run ./scripts/gen_secrets.sh}" ]

  # --- prod fail-fast 전면화: A/D·PCAP·DB 시크릿도 미설정이면 부팅 실패(base의 dev 기본값 override) ---
  attack_defense:
    environment:
      - ATTACK_DEFENSE_FLAG_SECRET=${ATTACK_DEFENSE_FLAG_SECRET:?prod requires ATTACK_DEFENSE_FLAG_SECRET — run ./scripts/gen_secrets.sh}
      - ATTACK_DEFENSE_FLAG_HASH_SECRET=${ATTACK_DEFENSE_FLAG_HASH_SECRET:?prod requires ATTACK_DEFENSE_FLAG_HASH_SECRET}
      - ATTACK_DEFENSE_MANAGEMENT_TOKEN=${ATTACK_DEFENSE_MANAGEMENT_TOKEN:?prod requires ATTACK_DEFENSE_MANAGEMENT_TOKEN}
      - PCAP_ANONYMIZATION_SECRET=${PCAP_ANONYMIZATION_SECRET:?prod requires PCAP_ANONYMIZATION_SECRET}
      - PCAP_WATERMARK_SECRET=${PCAP_WATERMARK_SECRET:?prod requires PCAP_WATERMARK_SECRET}
      - CHALLENGE_SECRET=${CHALLENGE_SECRET:?prod requires CHALLENGE_SECRET}
  ad_postgres:
    environment:
      POSTGRES_PASSWORD: ${AD_POSTGRES_PASSWORD:?prod requires AD_POSTGRES_PASSWORD — run ./scripts/gen_secrets.sh}

  # 감사 3.2: ingest 프록시도 동일 S2S 토큰 주입(fail-fast).
  ingest_proxy:
    environment: [ "INGEST_FALLBACK_AUTH=", "SERVICE_TOKEN=${SERVICE_TOKEN:?prod requires SERVICE_TOKEN — run ./scripts/gen_secrets.sh}" ]

  scenario_engine:
    environment:
      - RANGE_SCOPE_ENFORCE=true
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?prod requires AUTH_JWT_SECRET}
      - SERVICE_TOKEN=${SERVICE_TOKEN:?prod requires SERVICE_TOKEN}
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:?prod requires INSTRUCTOR_TOKEN}
  aar_report:
    environment:
      - RANGE_SCOPE_ENFORCE=true
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?prod requires AUTH_JWT_SECRET}
      - SERVICE_TOKEN=${SERVICE_TOKEN:?prod requires SERVICE_TOKEN}
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:?prod requires INSTRUCTOR_TOKEN}
  observability:
    environment:
      - RANGE_SCOPE_ENFORCE=true
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?prod requires AUTH_JWT_SECRET}
      - SERVICE_TOKEN=${SERVICE_TOKEN:?prod requires SERVICE_TOKEN}
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:?prod requires INSTRUCTOR_TOKEN}
  noc_monitor:
    environment:
      - RANGE_ASSET_SCOPES=${RANGE_ASSET_SCOPES:-}
      - RANGE_SCOPE_ENFORCE=true
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?prod requires AUTH_JWT_SECRET}
      - SERVICE_TOKEN=${SERVICE_TOKEN:?prod requires SERVICE_TOKEN}
      - INSTRUCTOR_TOKEN=${INSTRUCTOR_TOKEN:?prod requires INSTRUCTOR_TOKEN}
  ground_station:
    environment:
      - RANGE_AGENT_TOKEN=${RANGE_AGENT_GROUND_STATION:?run ./scripts/gen_secrets.sh for scoped sensor credentials}
  power_plant:
    environment:
      - RANGE_AGENT_TOKEN=${RANGE_AGENT_POWER_PLANT:?run ./scripts/gen_secrets.sh for scoped sensor credentials}
  defense_network:
    environment:
      - RANGE_AGENT_TOKEN=${RANGE_AGENT_DEFENSE_NETWORK:?run ./scripts/gen_secrets.sh for scoped sensor credentials}
  refinery_plant:
    environment:
      - RANGE_AGENT_TOKEN=${RANGE_AGENT_REFINERY_PLANT:?run ./scripts/gen_secrets.sh for scoped sensor credentials}
  smart_factory:
    environment:
      - RANGE_AGENT_TOKEN=${RANGE_AGENT_SMART_FACTORY:?run ./scripts/gen_secrets.sh for scoped sensor credentials}
  water_utility:
    environment:
      - RANGE_AGENT_TOKEN=${RANGE_AGENT_WATER_UTILITY:?run ./scripts/gen_secrets.sh for scoped sensor credentials}
  lng_terminal:
    environment:
      - RANGE_AGENT_TOKEN=${RANGE_AGENT_LNG_TERMINAL:?run ./scripts/gen_secrets.sh for scoped sensor credentials}
  railway_signaling:
    environment:
      - RANGE_AGENT_TOKEN=${RANGE_AGENT_RAILWAY_SIGNALING:?run ./scripts/gen_secrets.sh for scoped sensor credentials}
  airport_ot:
    environment:
      - RANGE_AGENT_TOKEN=${RANGE_AGENT_AIRPORT_OT:?run ./scripts/gen_secrets.sh for scoped sensor credentials}
  datacenter_bms:
    environment:
      - RANGE_AGENT_TOKEN=${RANGE_AGENT_DATACENTER_BMS:?run ./scripts/gen_secrets.sh for scoped sensor credentials}
  hospital_ot:
    environment:
      - RANGE_AGENT_TOKEN=${RANGE_AGENT_HOSPITAL_OT:?run ./scripts/gen_secrets.sh for scoped sensor credentials}

volumes:
  gateway_certs: {}
