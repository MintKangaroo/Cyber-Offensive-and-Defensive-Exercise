# 매치 vhost 리버스 프록시 (P3) — Host: <match>.<sector>.<domain> → 해당 매치 트윈 게이트웨이.
# 예) match_a.ref.range.local → 컨테이너 match_a-ref_gw-1:8201 (match_a의 정유 트윈)
# 배포 스크립트가 match_proxy를 각 매치의 edge 네트워크에 connect해 게이트웨이 컨테이너를 DNS 해석.
# 포트 오프셋을 외우지 않고 팀별 도메인으로 접근(동적 포트의 도메인 대안).

# sector 약어 → 트윈 내부 포트 매핑
map $sector $twinport {
    ref 8201; fac 8202; wtr 8203; lng 8204; rwy 8205; air 8206; dcx 8207; hsp 8208;
    gs  8001; pp  8002; dn  8003;
    default 8201;
}

server {
    listen 8088;
    # Host 앞 두 라벨을 match / sector 로 캡처: <match>.<sector>.<도메인...>
    server_name ~^(?<match>[^.]+)\.(?<sector>[^.]+)\..+$;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # 컨테이너명: <match>-<sector>_gw-1 (compose 프로젝트=match, 서비스=<sector>_gw)
        proxy_pass http://${match}-${sector}_gw-1:$twinport$request_uri;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
    }
}

# 매핑 실패/도메인 미스 시 안내
server {
    listen 8088 default_server;
    location / { return 421 "match vhost: use Host <match>.<sector>.range.local (sector=ref/fac/wtr/lng/rwy/air/dcx/hsp/gs/pp/dn)\n"; }
}
