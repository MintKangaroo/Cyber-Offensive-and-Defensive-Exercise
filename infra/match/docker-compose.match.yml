# 매치별 트윈 셋 (P2/P3) — 11섹터 전체 완전 물리 격리
# 별도 compose 프로젝트(-p match_<id>)로 트윈 인스턴스 복제. twinnet(internal)로 egress·cross-match
# 차단, gateway는 edge로 오프셋 포트 게시. 코어는 deploy_match.sh가 twinnet에 connect.
# MATCH_SCENARIO_ID로 이벤트 태깅(코어3섹터는 event_client 기본 scenario가 env로 해결).
services:
  refinery_plant:
    build: { context: ../.., dockerfile: services/refinery_plant/Dockerfile }
    environment: [ "MATCH_SCENARIO_ID=${MATCH_SCENARIO_ID:-default}" ]
    networks: [twinnet]
  smart_factory:
    build: { context: ../.., dockerfile: services/smart_factory/Dockerfile }
    environment: [ "MATCH_SCENARIO_ID=${MATCH_SCENARIO_ID:-default}" ]
    networks: [twinnet]
  water_utility:
    build: { context: ../.., dockerfile: services/water_utility/Dockerfile }
    environment: [ "MATCH_SCENARIO_ID=${MATCH_SCENARIO_ID:-default}" ]
    networks: [twinnet]
  lng_terminal:
    build: { context: ../.., dockerfile: services/lng_terminal/Dockerfile }
    environment: [ "MATCH_SCENARIO_ID=${MATCH_SCENARIO_ID:-default}" ]
    networks: [twinnet]
  railway_signaling:
    build: { context: ../.., dockerfile: services/railway_signaling/Dockerfile }
    environment: [ "MATCH_SCENARIO_ID=${MATCH_SCENARIO_ID:-default}" ]
    networks: [twinnet]
  airport_ot:
    build: { context: ../.., dockerfile: services/airport_ot/Dockerfile }
    environment: [ "MATCH_SCENARIO_ID=${MATCH_SCENARIO_ID:-default}" ]
    networks: [twinnet]
  datacenter_bms:
    build: { context: ../.., dockerfile: services/datacenter_bms/Dockerfile }
    environment: [ "MATCH_SCENARIO_ID=${MATCH_SCENARIO_ID:-default}" ]
    networks: [twinnet]
  hospital_ot:
    build: { context: ../.., dockerfile: services/hospital_ot/Dockerfile }
    environment: [ "MATCH_SCENARIO_ID=${MATCH_SCENARIO_ID:-default}" ]
    networks: [twinnet]
  ground_station:
    build: { context: ../.., dockerfile: services/ground_station/Dockerfile }
    environment: [ "MATCH_SCENARIO_ID=${MATCH_SCENARIO_ID:-default}" ]
    networks: [twinnet]
  power_plant:
    build: { context: ../.., dockerfile: services/power_plant/Dockerfile }
    environment: [ "MATCH_SCENARIO_ID=${MATCH_SCENARIO_ID:-default}" ]
    networks: [twinnet]
  defense_network:
    build: { context: ../.., dockerfile: services/defense_network/Dockerfile }
    environment: [ "MATCH_SCENARIO_ID=${MATCH_SCENARIO_ID:-default}" ]
    networks: [twinnet]

  ref_gw:
    image: nginx:alpine
    ports: [ "${REF_PORT:-8301}:8201" ]
    volumes: [ ../twin_gateway/ref.conf:/etc/nginx/conf.d/default.conf:ro ]
    depends_on: [refinery_plant]
    networks: [twinnet, edge]
  fac_gw:
    image: nginx:alpine
    ports: [ "${FAC_PORT:-8302}:8202" ]
    volumes: [ ../twin_gateway/fac.conf:/etc/nginx/conf.d/default.conf:ro ]
    depends_on: [smart_factory]
    networks: [twinnet, edge]
  wtr_gw:
    image: nginx:alpine
    ports: [ "${WTR_PORT:-8303}:8203" ]
    volumes: [ ../twin_gateway/wtr.conf:/etc/nginx/conf.d/default.conf:ro ]
    depends_on: [water_utility]
    networks: [twinnet, edge]
  lng_gw:
    image: nginx:alpine
    ports: [ "${LNG_PORT:-8304}:8204" ]
    volumes: [ ../twin_gateway/lng.conf:/etc/nginx/conf.d/default.conf:ro ]
    depends_on: [lng_terminal]
    networks: [twinnet, edge]
  rwy_gw:
    image: nginx:alpine
    ports: [ "${RWY_PORT:-8305}:8205" ]
    volumes: [ ../twin_gateway/rwy.conf:/etc/nginx/conf.d/default.conf:ro ]
    depends_on: [railway_signaling]
    networks: [twinnet, edge]
  air_gw:
    image: nginx:alpine
    ports: [ "${AIR_PORT:-8306}:8206" ]
    volumes: [ ../twin_gateway/air.conf:/etc/nginx/conf.d/default.conf:ro ]
    depends_on: [airport_ot]
    networks: [twinnet, edge]
  dcx_gw:
    image: nginx:alpine
    ports: [ "${DCX_PORT:-8307}:8207" ]
    volumes: [ ../twin_gateway/dcx.conf:/etc/nginx/conf.d/default.conf:ro ]
    depends_on: [datacenter_bms]
    networks: [twinnet, edge]
  hsp_gw:
    image: nginx:alpine
    ports: [ "${HSP_PORT:-8308}:8208" ]
    volumes: [ ../twin_gateway/hsp.conf:/etc/nginx/conf.d/default.conf:ro ]
    depends_on: [hospital_ot]
    networks: [twinnet, edge]
  gs_gw:
    image: nginx:alpine
    ports: [ "${GS_PORT:-8309}:8001" ]
    volumes: [ ../twin_gateway/gs.conf:/etc/nginx/conf.d/default.conf:ro ]
    depends_on: [ground_station]
    networks: [twinnet, edge]
  pp_gw:
    image: nginx:alpine
    ports: [ "${PP_PORT:-8310}:8002" ]
    volumes: [ ../twin_gateway/pp.conf:/etc/nginx/conf.d/default.conf:ro ]
    depends_on: [power_plant]
    networks: [twinnet, edge]
  dn_gw:
    image: nginx:alpine
    ports: [ "${DN_PORT:-8311}:8003" ]
    volumes: [ ../twin_gateway/dn.conf:/etc/nginx/conf.d/default.conf:ro ]
    depends_on: [defense_network]
    networks: [twinnet, edge]

networks:
  twinnet: { driver: bridge, internal: true }
  edge: { driver: bridge }
