# A/D 공격 타깃 게이트웨이
# ================================================
# 팀 취약 서비스(notes/vault/grid)는 internal 네트워크(ad_team_access)에 격리되어 host 에서
# 직접 도달할 수 없다(Docker 가 internal 망으로는 포트를 발행하지 못함). 이 게이트웨이는
# internal 망과 host 를 잇는 유일한 통제 지점으로, attack-surface API 가 광고하는 포트
# (9101~9303) 를 host 에 발행해 참가자(Red 포털 브라우저)가 직접 공격할 수 있게 한다.
#
# 게임(공격) 포트 9000 만 프록시한다. 관리 포트 9001(/management/*, 플래그 주입/검증)은
# 절대 노출하지 않아 서비스 격리 원칙을 유지한다.
#
# 컨테이너 이름 대신 compose 서비스 별칭을 쓰고, Docker 임베디드 DNS(127.0.0.11)로 요청
# 시점에 해석해 타깃이 잠시 내려가도 게이트웨이가 죽지 않게 한다.

# team-01
server {
    listen 9101;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / { set $u ad_team_01_notes:9000; proxy_pass http://$u; proxy_set_header Host $host; proxy_read_timeout 15s; }
}
server {
    listen 9201;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / { set $u ad_team_01_vault:9000; proxy_pass http://$u; proxy_set_header Host $host; proxy_read_timeout 15s; }
}
server {
    listen 9301;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / { set $u ad_team_01_grid:9000; proxy_pass http://$u; proxy_set_header Host $host; proxy_read_timeout 15s; }
}

