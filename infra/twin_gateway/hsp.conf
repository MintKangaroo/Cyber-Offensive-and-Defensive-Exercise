# hospital_ot 전용 인그레스 게이트웨이 (로드맵 F ★★★, ICS/OT 섹터 확장)
# per-twin 분리: 이 게이트웨이는 자기 트윈 네트워크(twin_hospital_ot) 하나와만 연결되므로
# 경유해도 다른 섹터 트윈에 도달할 수 없다(간접 lateral 차단).
server {
    listen 8208;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $twin hospital_ot;
        proxy_pass http://$twin:8208$request_uri;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
    }
}
