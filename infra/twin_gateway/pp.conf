# power_plant 전용 인그레스 게이트웨이 (로드맵 F ★★★, gs.conf 주석 참고)
server {
    listen 8002;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $twin power_plant;
        proxy_pass http://$twin:8002$request_uri;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
    }
}
