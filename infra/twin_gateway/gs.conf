# ground_station 전용 인그레스 게이트웨이 (로드맵 F ★★★)
# per-twin 분리 이유: 게이트웨이가 자기 트윈 네트워크(twin_ground_station) 하나와만
# 연결되므로, 이 게이트웨이를 경유해도 다른 트윈(pp/dn)에는 도달할 수 없다
# (단일 게이트웨이였다면 트윈→게이트웨이→형제트윈 간접 lateral이 열렸음).
server {
    listen 8001;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $twin ground_station;
        proxy_pass http://$twin:8001$request_uri;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
    }
}
