global
  log stdout format raw local0

defaults
  log global
  mode http
  option httplog
  timeout connect 3s
  timeout client 30s
  timeout server 30s
  timeout http-keep-alive 10s

resolvers docker
  nameserver embedded 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend attack_defense_api
  bind :8110
  default_backend attack_defense_replicas

backend attack_defense_replicas
  balance roundrobin
  option httpchk GET /ready
  http-check expect status 200
  server-template replica 1-4 attack_defense_ha:8100 check resolvers docker init-addr libc,none
