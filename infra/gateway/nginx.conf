# 단일 진입점 gateway (P0-1) — 5개 대시보드 정적 서빙 + /api/* 백엔드 프록시 + TLS.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    # TLS가 준비되면 https로 리다이렉트(entrypoint가 443 server를 활성화).
    location / { return 301 https://$host$request_uri; }
    location /healthz { return 200 "ok\n"; }
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /certs/gateway.crt;
    ssl_certificate_key /certs/gateway.key;
    client_max_body_size 20m;

    # --- 인증(P0-2): 로그인 페이지·auth 서비스 프록시(공개) ---
    location = /login { root /usr/share/nginx/html; try_files /login.html =404; }
    location /auth/ { proxy_pass http://auth:8051/auth/; include /etc/nginx/proxy_ws.conf; }
    # auth_request 내부 검증(쿠키 JWT 확인 → 200/401, 유효 시 X-Auth-Token 헤더 반환)
    location = /_authcheck {
        internal;
        proxy_pass http://auth:8051/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    error_page 401 = @to_login;
    location @to_login { return 302 /login; }

    # --- 랜딩(역할 선택) ---
    location = / { root /usr/share/nginx/html; try_files /landing.html =404; }
    location = /healthz { return 200 "ok\n"; }

    # --- 대시보드(정적 SPA, 서브경로) ---
    location /control/   { auth_request /_authcheck; alias /usr/share/nginx/html/control/;   try_files $uri $uri/ /control/index.html; }
    location /ops/       { auth_request /_authcheck; alias /usr/share/nginx/html/ops/;       try_files $uri $uri/ /ops/index.html; }
    location /red/       { auth_request /_authcheck; alias /usr/share/nginx/html/red/;       try_files $uri $uri/ /red/index.html; }
    location /blue/siem/ { auth_request /_authcheck; alias /usr/share/nginx/html/blue/siem/; try_files $uri $uri/ /blue/siem/index.html; }
    location /blue/edr/  { auth_request /_authcheck; alias /usr/share/nginx/html/blue/edr/;  try_files $uri $uri/ /blue/edr/index.html; }
    location /blue/      { auth_request /_authcheck; alias /usr/share/nginx/html/blue/;      try_files $uri $uri/ /blue/index.html; }

    # --- 백엔드 API 프록시(포트 하드코딩 제거) ---
    location /api/events/     { auth_request /_authcheck; auth_request_set $bt $upstream_http_x_auth_token; proxy_pass http://event_collector:8010/; include /etc/nginx/proxy_ws.conf; proxy_set_header Authorization "Bearer $bt"; }
    location /api/scoring/    { auth_request /_authcheck; auth_request_set $bt $upstream_http_x_auth_token; proxy_pass http://scoring_engine:8020/;  include /etc/nginx/proxy_ws.conf; proxy_set_header Authorization "Bearer $bt"; }
    location /api/config/     { auth_request /_authcheck; auth_request_set $bt $upstream_http_x_auth_token; proxy_pass http://config_service:8030/;  include /etc/nginx/proxy_ws.conf; proxy_set_header Authorization "Bearer $bt"; }
    location /api/siem/       { auth_request /_authcheck; auth_request_set $bt $upstream_http_x_auth_token; proxy_pass http://siem_api:8040/;        include /etc/nginx/proxy_ws.conf; proxy_set_header Authorization "Bearer $bt"; }
    location /api/instructor/ { auth_request /_authcheck; auth_request_set $bt $upstream_http_x_auth_token; proxy_pass http://instructor_api:8050/;  include /etc/nginx/proxy_ws.conf; proxy_set_header Authorization "Bearer $bt"; }
    location /api/edr/        { auth_request /_authcheck; auth_request_set $bt $upstream_http_x_auth_token; proxy_pass http://edr_backend:8080/;      include /etc/nginx/proxy_ws.conf; proxy_set_header Authorization "Bearer $bt"; }
    location /api/portal/     { auth_request /_authcheck; auth_request_set $bt $upstream_http_x_auth_token; proxy_pass http://challenge_portal:8060/; include /etc/nginx/proxy_ws.conf; proxy_set_header Authorization "Bearer $bt"; }
    location /api/range/      { auth_request /_authcheck; auth_request_set $bt $upstream_http_x_auth_token; proxy_pass http://range_control:8055/;    include /etc/nginx/proxy_ws.conf; proxy_set_header Authorization "Bearer $bt"; }
    location /api/incident/   { auth_request /_authcheck; auth_request_set $bt $upstream_http_x_auth_token; proxy_pass http://incident:8095/;        include /etc/nginx/proxy_ws.conf; proxy_set_header Authorization "Bearer $bt"; }
    location /api/injects/    { auth_request /_authcheck; auth_request_set $bt $upstream_http_x_auth_token; proxy_pass http://injects:8096/;         include /etc/nginx/proxy_ws.conf; proxy_set_header Authorization "Bearer $bt"; }
    location /api/scenario/   { auth_request /_authcheck; auth_request_set $bt $upstream_http_x_auth_token; proxy_pass http://scenario_engine:8045/;   include /etc/nginx/proxy_ws.conf; proxy_set_header Authorization "Bearer $bt"; }
    location /api/observability/ { auth_request /_authcheck; proxy_pass http://observability:8097/; include /etc/nginx/proxy_ws.conf; }
    # Prometheus 스크레이프용(비인증) — 내부 ops 네트워크에서만 접근하도록 배포 시 방화벽 권장.
    location = /metrics       { proxy_pass http://observability:8097/metrics; }
}
