# 단일 진입점 gateway (P0-1) — 5개 대시보드 정적 서빙 + /api/* 백엔드 프록시 + TLS.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    # TLS가 준비되면 https로 리다이렉트(entrypoint가 443 server를 활성화).
    location / { return 301 https://$host$request_uri; }
    location /healthz { return 200 "ok\n"; }
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /certs/gateway.crt;
    ssl_certificate_key /certs/gateway.key;
    client_max_body_size 20m;

    # --- 랜딩(역할 선택) ---
    location = / { root /usr/share/nginx/html; try_files /landing.html =404; }
    location = /healthz { return 200 "ok\n"; }

    # --- 대시보드(정적 SPA, 서브경로) ---
    location /ops/       { alias /usr/share/nginx/html/ops/;       try_files $uri $uri/ /ops/index.html; }
    location /red/       { alias /usr/share/nginx/html/red/;       try_files $uri $uri/ /red/index.html; }
    location /blue/siem/ { alias /usr/share/nginx/html/blue/siem/; try_files $uri $uri/ /blue/siem/index.html; }
    location /blue/edr/  { alias /usr/share/nginx/html/blue/edr/;  try_files $uri $uri/ /blue/edr/index.html; }
    location /blue/      { alias /usr/share/nginx/html/blue/;      try_files $uri $uri/ /blue/index.html; }

    # --- 백엔드 API 프록시(포트 하드코딩 제거) ---
    location /api/events/     { proxy_pass http://event_collector:8010/; include /etc/nginx/proxy_ws.conf; }
    location /api/scoring/    { proxy_pass http://scoring_engine:8020/;  include /etc/nginx/proxy_ws.conf; }
    location /api/config/     { proxy_pass http://config_service:8030/;  include /etc/nginx/proxy_ws.conf; }
    location /api/siem/       { proxy_pass http://siem_api:8040/;        include /etc/nginx/proxy_ws.conf; }
    location /api/instructor/ { proxy_pass http://instructor_api:8050/;  include /etc/nginx/proxy_ws.conf; }
    location /api/edr/        { proxy_pass http://edr_backend:8080/;      include /etc/nginx/proxy_ws.conf; }
    location /api/portal/     { proxy_pass http://challenge_portal:8060/; include /etc/nginx/proxy_ws.conf; }
    location /api/range/      { proxy_pass http://range_control:8055/;    include /etc/nginx/proxy_ws.conf; }
}
